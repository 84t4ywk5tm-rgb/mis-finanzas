    </div>
  );
  if (seccion === "categorias") return (
    <div className="flex flex-col gap-4">
      <button type="button" onClick={() => setSeccion(null)} className="self-start text-sm font-semibold text-brand flex items-center gap-1"><Ic n="ChevronLeft" size={16} />Ajustes</button>
      <p className="text-sm text-muted">Si cambiás un nombre, se actualiza en todos tus movimientos. Si borrás una, lo que ya cargaste la conserva.</p>
      <p className="label">Categorías de egresos</p>
      <ListaEditable items={cats.filter((c) => c.tipo === "egreso")} iconos={ICONOS_CAT} conColor nuevoLabel="Agregar categoría de egreso"
        onCambiar={setCats("egreso")} onRenombrar={(a, b) => renombrar("cat", a, b)} />
      <p className="label mt-2">Categorías de ingresos</p>
      <ListaEditable items={cats.filter((c) => c.tipo === "ingreso")} iconos={ICONOS_CAT} conColor nuevoLabel="Agregar categoría de ingreso"
        onCambiar={setCats("ingreso")} onRenombrar={(a, b) => renombrar("cat", a, b)} />
    </div>
  );
  const Fila = ({ icon, titulo, sub, onClick }) => (
    <button type="button" onClick={onClick} className="flex items-center gap-3 rounded-2xl bg-surface2 border border-line p-3.5 text-left">
      <span className="h-10 w-10 grid place-items-center rounded-xl bg-brandsoft text-brand shrink-0"><Ic n={icon} size={19} /></span>
      <div className="flex-1 min-w-0"><p className="font-semibold">{titulo}</p><p className="text-xs text-muted truncate">{sub}</p></div>
      <Ic n="ChevronRight" className="text-muted" />
    </button>
  );
  return (
    <div className="flex flex-col gap-2.5">
      <Fila icon="Wallet" titulo="Medios de pago" sub={meds.map((m) => m.id).join(", ")} onClick={() => setSeccion("medios")} />
      <Fila icon="CreditCard" titulo="Tarjetas de crédito" sub={tars.map((t) => t.id).join(", ")} onClick={() => setSeccion("tarjetas")} />
      <Fila icon="Tags" titulo="Categorías" sub={`${cats.filter((c) => c.tipo === "egreso").length} de egresos, ${cats.filter((c) => c.tipo === "ingreso").length} de ingresos`} onClick={() => setSeccion("categorias")} />
      {!EN_ARTIFACT && <Fila icon={cfgOn ? "Cloud" : "CloudOff"} titulo="Google Sheets" sub={syncTxt} onClick={() => ir("sheets")} />}
    </div>
  );
}

/* ---------- App ---------- */
const TABS = [
  { id: "inicio", label: "Inicio", icon: "LayoutDashboard", titulo: "Mis finanzas" },
  { id: "historial", label: "Historial", icon: "ArrowLeftRight", titulo: "Movimientos" },
  { id: "deudas", label: "Deudas", icon: "HandCoins", titulo: "Deudas" },
  { id: "ahorros", label: "Ahorros", icon: "PiggyBank", titulo: "Ahorros" },
  { id: "cousteau", label: "Cousteau", icon: "Store", titulo: "Plata en Cousteau" },
  { id: "empresa", label: "Empresa", icon: "Building2", titulo: "Gastos de la empresa" },
];
const TAB_COLOR = { cousteau: ["text-cou", "bg-cousoft"], empresa: ["text-emp", "bg-empsoft"] };

function App() {
  const [data, setData] = useState(cargar);
  aplicarCatalogos(data);
  const renombrar = (tipo, de, a) => setData((s) => tipo === "tarjeta" ? ({
    ...s,
    movs: s.movs.map((m) => (m.tarjeta === de ? { ...m, tarjeta: a } : m)),
    fijos: s.fijos.map((f) => (f.tarjeta === de ? { ...f, tarjeta: a } : f)),
  }) : tipo === "medio" ? ({
    ...s,
    movs: s.movs.map((m) => (m.pago === de ? { ...m, pago: a } : m)),
    fijos: s.fijos.map((f) => (f.pago === de ? { ...f, pago: a } : f)),
    cousteau: s.cousteau.map((c) => (c.medio === de ? { ...c, medio: a } : c)),
  }) : ({
    ...s,
    movs: s.movs.map((m) => (m.cat === de ? { ...m, cat: a } : m)),
    fijos: s.fijos.map((f) => (f.cat === de ? { ...f, cat: a } : f)),
  }));
  const agregarCat = (tipo, nombre) => {
    const usados = (data.categorias || []).length;
    setData((s) => ({ ...s, categorias: [...(s.categorias && s.categorias.length ? s.categorias : categoriasBase()), { key: "k" + uid(), id: nombre, tipo, icon: tipo === "ingreso" ? "PlusCircle" : "Package", color: COLORES_CAT[usados % COLORES_CAT.length] }] }));
  };
  const agregarMedio = (nombre) => setData((s) => ({ ...s, medios: [...(s.medios && s.medios.length ? s.medios : mediosBase()), { key: "k" + uid(), id: nombre, icon: "Wallet" }] }));
  const [tab, setTab] = useState(() => { const h = location.hash.slice(1); return TABS.some((t) => t.id === h) ? h : "inicio"; });
  const [sheet, setSheet] = useState(null);
  const [toast, setToast] = useState("");
  const [editando, setEditando] = useState(null);
  const borrarMov = (id) => { setData((s) => ({ ...s, movs: s.movs.filter((m) => m.id !== id) })); setToast("Movimiento eliminado"); };

  /* sincronización: estados posibles local | cargando | guardando | ok | error */
  const [cfg, setCfg] = useState(() => (EN_ARTIFACT ? null : leerCfg()));
  const [sync, setSync] = useState(() => (cfg ? "cargando" : "local"));
  const [syncErr, setSyncErr] = useState("");
  const [inicial, setInicial] = useState(!!cfg);
  const dataRef = useRef(data);
  const cfgRef = useRef(cfg);
  const listo = useRef(!cfg);
  const saltar = useRef(false);
  const timer = useRef(null);
  dataRef.current = data;
  cfgRef.current = cfg;

  const subir = async (c = cfgRef.current) => {
    if (!c) return;
    setSync("guardando");
    try {
      await llamarSheets(c, { datos: aSheets(dataRef.current), encabezados: ENCABEZADOS });
      if (!timer.current) marcarPendiente(false);
      setSync("ok"); setSyncErr("");
    } catch (e) { setSync("error"); setSyncErr(mensajeError(e)); }
  };
  const bajar = async (c = cfgRef.current) => {
    if (!c) return;
    setSync("cargando");
    try {
      const j = await llamarSheets(c);
      const srv = deSheets(j.datos || {});
      const { medios: srvMedios, categorias: srvCats, tarjetas: srvTarjetas, ...registros } = srv;
      const vacioSrv = Object.values(registros).every((a) => a.length === 0);
      listo.current = true;
      if (vacioSrv) { await subir(c); }
      else {
        saltar.current = true;
        setData((s) => ({ ...s, ...registros, medios: srvMedios.length ? srvMedios : s.medios, categorias: srvCats.length ? srvCats : s.categorias, tarjetas: srvTarjetas.length ? srvTarjetas : s.tarjetas }));
        setSync("ok"); setSyncErr("");
      }
    } catch (e) { listo.current = true; setSync("error"); setSyncErr(mensajeError(e)); }
    setInicial(false);
  };

  useEffect(() => {
    if (!cfg) return;
    if (hayPendiente()) { listo.current = true; setInicial(false); subir(cfg); } else bajar(cfg);
    const alVolver = () => {
      if (document.visibilityState !== "visible" || !cfgRef.current) return;
      if (hayPendiente()) subir(); else bajar();
    };
    document.addEventListener("visibilitychange", alVolver);
    return () => document.removeEventListener("visibilitychange", alVolver);
  }, [cfg]);

  useEffect(() => {
    try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) {}
    if (!cfgRef.current) return;
    if (saltar.current) { saltar.current = false; return; }
    if (!listo.current) return;
    marcarPendiente(true);
    clearTimeout(timer.current);
    timer.current = setTimeout(() => { timer.current = null; subir(); }, 1200);
  }, [data]);

  const conectar = (c) => { guardarCfg(c); listo.current = false; setSheet(null); setCfg(c); setToast("Conectado con Google Sheets"); };
  const desconectar = () => { guardarCfg(null); marcarPendiente(false); setCfg(null); setSync("local"); setSheet(null); setToast("Desconectado de Sheets"); };
  const SYNC_UI = {
    local: ["Solo en este teléfono", "CloudOff", "text-muted"],
    cargando: ["Actualizando…", "RefreshCw", "text-muted"],
    guardando: ["Guardando…", "RefreshCw", "text-muted"],
    ok: ["Guardado en Sheets", "Cloud", "text-inc"],
    error: ["Sin conexión", "CloudOff", "text-exp"],
  };

  useEffect(() => { if (toast) { const t = setTimeout(() => setToast(""), 2200); return () => clearTimeout(t); } }, [toast]);
  const ir = (t) => { setTab(t); window.scrollTo({ top: 0 }); };
  const cerrar = () => setSheet(null);

  const hoy = new Date();
  const actual = TABS.find((t) => t.id === tab);
  const pendCousteau = sum(data.cousteau.filter((c) => c.tipo === "aporte")) - sum(data.cousteau.filter((c) => c.tipo === "devolucion"));

  return (
    <div className="mx-auto max-w-md min-h-full px-4" style={{ paddingBottom: "calc(150px + env(safe-area-inset-bottom, 0px))" }}>
      <header className="pt-5 pb-4 flex items-start justify-between gap-3">
        <div className="min-w-0">
          <p className="text-sm text-muted capitalize">{DIAS[hoy.getDay()]} {hoy.getDate()} de {MESES_L[hoy.getMonth()]}</p>
          <h1 className="display text-[1.75rem] font-bold leading-tight">{actual.titulo}</h1>
        </div>
        <div className="mt-1 flex items-center gap-2 shrink-0">
          {!EN_ARTIFACT && (
            <button onClick={() => setSheet("sheets")} className="flex items-center gap-1.5 h-9 pl-2.5 pr-3 rounded-full bg-surface border border-line text-xs font-semibold" aria-label={`Google Sheets: ${SYNC_UI[sync][0]}`}>
              <span className={SYNC_UI[sync][2]}><Ic n={SYNC_UI[sync][1]} size={15} /></span>
              <span className="text-muted max-[360px]:hidden">{SYNC_UI[sync][0]}</span>
            </button>
          )}
          <button onClick={() => setSheet("ajustes")} className="h-9 w-9 grid place-items-center rounded-full bg-surface border border-line text-muted" aria-label="Ajustes"><Ic n="Settings" size={17} /></button>
        </div>
      </header>
      {sync === "error" && syncErr && (
        <button onClick={() => subir()} className="mb-4 w-full rounded-2xl bg-expsoft text-exp text-sm px-4 py-3 text-left flex items-center gap-2">
          <Ic n="AlertTriangle" size={16} />
          <span className="flex-1">{syncErr} Tus cambios quedan en el teléfono. Tocá para reintentar.</span>
        </button>
      )}
      {cfg === null && !EN_ARTIFACT && (data.movs.length > 0 || data.cousteau.length > 0) && (
        <button onClick={() => setSheet("sheets")} className="mb-4 w-full rounded-2xl border border-dashed border-line text-sm px-4 py-3 text-left flex items-center gap-2 text-muted">
          <Ic n="CloudOff" size={16} /><span className="flex-1">Tus datos están solo en este teléfono. Conectá Google Sheets para guardarlos.</span><Ic n="ChevronRight" size={16} />
        </button>
      )}
      {inicial && (
        <div className="fixed inset-0 z-[70] bg-bg grid place-items-center">
          <div className="text-center text-muted"><span className="inline-block animate-spin"><Ic n="RefreshCw" size={28} /></span><p className="mt-3">Trayendo tus datos de Sheets…</p></div>
        </div>
      )}

      <main>
        {tab === "inicio" && <Dashboard data={data} ir={ir} abrir={setSheet} onEdit={setEditando} onDelete={borrarMov} />}
        {tab === "historial" && <Historial data={data} abrir={setSheet} onEdit={setEditando} onDelete={borrarMov} />}
        {tab === "empresa" && <Empresa data={data} setData={setData} abrir={setSheet} />}
        {tab === "deudas" && <Deudas data={data} setData={setData} abrir={setSheet} />}
        {tab === "ahorros" && <Ahorros data={data} setData={setData} abrir={setSheet} />}
        {tab === "cousteau" && <Cousteau data={data} setData={setData} abrir={setSheet} />}
      </main>

      <button onClick={() => setSheet(tab === "empresa" ? "empresa" : tab === "cousteau" ? "cou-aporte" : "mov")}
        aria-label={tab === "empresa" ? "Cargar gasto de la empresa" : tab === "cousteau" ? "Cargar aporte a Cousteau" : "Cargar movimiento"}
        className="fixed z-40 h-14 w-14 rounded-2xl bg-brand text-brandink grid place-items-center shadow-lg active:scale-95 transition"
        style={{ right: "max(16px, calc(50vw - 14rem + 16px))", bottom: "calc(84px + env(safe-area-inset-bottom, 0px))" }}>
        <Ic n="Plus" size={28} />
      </button>

      <nav className="fixed bottom-0 inset-x-0 z-40 bg-surface border-t border-line" style={{ paddingBottom: "env(safe-area-inset-bottom, 0px)" }}>
        <div className="mx-auto max-w-md grid grid-cols-6 px-1 pt-1.5 pb-2">
          {TABS.map((t) => {
            const on = tab === t.id;
            const [txt, bgc] = TAB_COLOR[t.id] || ["text-brand", "bg-brandsoft"];
            return (
              <button key={t.id} onClick={() => ir(t.id)} aria-current={on ? "page" : undefined}
                className={`flex flex-col items-center gap-0.5 py-1 text-[10.5px] font-semibold min-w-0 ${on ? txt : "text-muted"}`}>
                <span className={`h-8 w-11 grid place-items-center rounded-full transition ${on ? bgc : ""}`}><Ic n={t.icon} size={20} /></span>
                <span className="truncate max-w-full">{t.label}</span>
              </button>
            );
          })}
        </div>
      </nav>

      {toast && (
        <div className="fixed left-1/2 -translate-x-1/2 z-[60] px-4 py-2.5 rounded-full bg-ink text-bg text-sm font-semibold shadow-lg flex items-center gap-2 whitespace-nowrap"
          style={{ bottom: "calc(150px + env(safe-area-inset-bottom, 0px))" }} role="status">
          <Ic n="CheckCircle2" size={16} />{toast}
        </div>
      )}

      {sheet === "mov" && (
        <Sheet title="Nuevo movimiento" onClose={cerrar}>
          <FormMovimiento onAgregarCat={agregarCat} onAgregarMedio={agregarMedio} onSave={(m) => { setData((s) => ({ ...s, movs: [...s.movs, m] })); cerrar(); setToast(m.tipo === "ingreso" ? "Ingreso guardado" : "Egreso guardado"); }} />
        </Sheet>
      )}
      {editando && (
        <Sheet title="Editar movimiento" onClose={() => setEditando(null)}>
          <FormMovimiento inicial={editando} onAgregarCat={agregarCat} onAgregarMedio={agregarMedio} onSave={(m) => { setData((s) => ({ ...s, movs: s.movs.map((x) => (x.id === m.id ? m : x)) })); setEditando(null); setToast("Cambios guardados"); }} />
          <button type="button" onClick={() => { borrarMov(editando.id); setEditando(null); }}
            className="mt-3 w-full h-12 rounded-2xl bg-expsoft text-exp font-semibold flex items-center justify-center gap-2"><Ic n="Trash2" size={17} />Eliminar movimiento</button>
        </Sheet>
      )}
      {sheet === "empresa" && (
        <Sheet title="Gasto de la empresa" onClose={cerrar}>
          <FormEmpresa onSave={(e) => { setData((s) => ({ ...s, empresa: [...s.empresa, e] })); cerrar(); setToast("Gasto de la empresa guardado"); ir("empresa"); }} />
        </Sheet>
      )}
      {sheet === "sheets" && (
        <Sheet title="Google Sheets" onClose={cerrar}>
          <FormSheets cfg={cfg} onConectar={conectar} onDesconectar={desconectar} />
        </Sheet>
      )}
      {sheet === "ajustes" && (
        <Sheet title="Ajustes" onClose={cerrar}>
          <Ajustes data={data} setData={setData} renombrar={renombrar} ir={setSheet} cfgOn={!!cfg} syncTxt={SYNC_UI[sync][0]} />
        </Sheet>
      )}
      {sheet === "cuotas" && (
        <Sheet title={`Cuotas de ${MESES_L[hoy.getMonth()]}`} onClose={cerrar}>
          <FormCuotas pendientes={cuotasActivas(data.movs, hoy).filter((a) => !a.cargadaEsteMes)}
            onLoad={(nuevos) => { setData((s) => ({ ...s, movs: [...s.movs, ...nuevos] })); cerrar(); setToast(`${nuevos.length} cuotas cargadas`); }} />
        </Sheet>
      )}
      {sheet === "fijos" && (
        <Sheet title={`Gastos fijos de ${MESES_L[hoy.getMonth()]}`} onClose={cerrar}>
          <FormFijos fijos={data.fijos} movs={data.movs}
            onTemplate={(fn) => setData((s) => ({ ...s, fijos: fn(s.fijos) }))}
            onLoad={(nuevos, plantilla) => { setData((s) => ({ ...s, movs: [...s.movs, ...nuevos], fijos: plantilla })); cerrar(); setToast(`${nuevos.length} gastos fijos cargados`); }} />
        </Sheet>
      )}
      {sheet === "deuda" && (
        <Sheet title="Nueva deuda" onClose={cerrar}>
          <FormDeuda onSave={(d) => { setData((s) => ({ ...s, deudas: [d, ...s.deudas] })); cerrar(); setToast("Deuda guardada"); ir("deudas"); }} />
        </Sheet>
      )}
      {sheet === "meta" && (
        <Sheet title="Nueva meta de ahorro" onClose={cerrar}>
          <FormMeta onSave={(m) => { setData((s) => ({ ...s, metas: [...s.metas, m] })); cerrar(); setToast("Meta creada"); }} />
        </Sheet>
      )}
      {(sheet === "cou-aporte" || sheet === "cou-devolucion") && (
        <Sheet title="Movimiento con Cousteau" onClose={cerrar}>
          <FormCousteau tipoInicial={sheet === "cou-aporte" ? "aporte" : "devolucion"} pendiente={pendCousteau}
            onSave={(c) => { setData((s) => ({ ...s, cousteau: [...s.cousteau, c] })); cerrar(); setToast(c.tipo === "aporte" ? "Aporte guardado" : "Devolución guardada"); }} />
        </Sheet>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>

</body>
</html>
