<script type="text/babel" data-presets="react">

/* ---------- utilidades ---------- */

const uid = () => Math.random().toString(36).slice(2, 10);

const MESES_L = ["enero", "febrero", "marzo", "abril", "mayo", "junio", "julio", "agosto", "septiembre", "octubre", "noviembre", "diciembre"];

/* ---------- catálogos ---------- */

  { id: "Seguros", icon: "ShieldCheck", color: "#7A8CA8" },
  { id: "Transporte", icon: "Car", color: "#8A6FD6" },
  { id: "Salud", icon: "HeartPulse", color: "#E07A3F" },
  { id: "Ropa", icon: "Shirt", color: "#C46BB8" },

  { id: "Ventas y extras", icon: "TrendingUp", color: "#2FB582" },

];
const PAGOS_BASE = [
  { id: "Transferencia", icon: "Landmark" },
  { id: "Efectivo", icon: "Banknote" },
  { id: "Tarjeta de Crédito", icon: "CreditCard" },
  { id: "Tarjeta de Débito", icon: "CreditCard" },
  { id: "ARQ", icon: "Smartphone" },
  { id: "Mercado Pago", icon: "Wallet" },
];
const CREDITO = "Tarjeta de Crédito"; /* fijo: activa la elección de tarjeta y cuotas */
const categoriasBase = () => [
  ...CAT_EGRESO_BASE.map((c, i) => ({ ...c, key: "ce" + i, tipo: "egreso" })),
  ...CAT_INGRESO_BASE.map((c, i) => ({ ...c, key: "ci" + i, tipo: "ingreso" })),
];
const mediosBase = () => PAGOS_BASE.map((p, i) => ({ ...p, key: "mp" + i }));
const ICONOS_CAT = ["Home", "Baby", "ShoppingCart", "GraduationCap", "ShieldCheck", "Car", "HeartPulse", "Shirt", "ShoppingBag", "Gamepad2", "Gift", "PawPrint", "Plane", "Dumbbell", "Coffee", "UtensilsCrossed", "Wrench", "Zap", "Music", "Sparkles", "Briefcase", "TrendingUp", "PlusCircle", "Package"];
const ICONOS_MEDIO = ["Banknote", "CreditCard", "Landmark", "Smartphone", "Wallet", "QrCode", "Coins", "ArrowLeftRight", "Building2", "Globe"];
const COLORES_CAT = ["#3B7DD8", "#D9577E", "#2A9D8F", "#5BA35B", "#7A8CA8", "#8A6FD6", "#E07A3F", "#C46BB8", "#3FA3C9", "#D9A520", "#C0504D", "#8E9A94"];

/* Catálogos vigentes: App los actualiza en cada render a partir de los datos */
let CAT_EGRESO = CAT_EGRESO_BASE, CAT_INGRESO = CAT_INGRESO_BASE, CATS = {}, PAGOS = PAGOS_BASE;
function aplicarCatalogos(d) {
  const cats = d.categorias && d.categorias.length ? d.categorias : categoriasBase();
  CAT_EGRESO = cats.filter((c) => c.tipo === "egreso");
  CAT_INGRESO = cats.filter((c) => c.tipo === "ingreso");
  CATS = Object.fromEntries(cats.map((c) => [c.id, c]));
  const meds = d.medios && d.medios.length ? d.medios : mediosBase();
  PAGOS = meds.some((m) => m.id === CREDITO) ? meds : [...meds, { id: CREDITO, icon: "CreditCard", key: "mp-credito" }];
  TARJETAS = d.tarjetas && d.tarjetas.length ? d.tarjetas : tarjetasBase();
}
const TARJETAS_BASE = [
  { id: "Banco Provincia", color: "#2A8C5A" },
  { id: "Santander Río", color: "#D3423A" },
  { id: "Macro", color: "#1F4E9C" },
];
const tarjetasBase = () => TARJETAS_BASE.map((t, i) => ({ ...t, key: "tc" + i, icon: "CreditCard" }));
const COLORES_TARJETA = ["#2A8C5A", "#D3423A", "#1F4E9C", "#E07A3F", "#7A3FA0", "#D9A520", "#2A9D8F", "#C46BB8", "#5B6B73", "#3B7DD8"];
let TARJETAS = TARJETAS_BASE;
const CAT_EMPRESA = [
  { id: "Combustible", icon: "Fuel" },
  { id: "Comidas", icon: "UtensilsCrossed" },

const EMP_ICON = Object.fromEntries(CAT_EMPRESA.map((c) => [c.id, c.icon]));

/* Plantilla de gastos fijos tomada de la planilla de agosto (montos de referencia, se editan al cargar) */
const FIJOS_BASE = [
  { id: "f-expensas", desc: "Expensas Rumenco", cat: "Hogar", pago: "Transferencia", monto: 700000 },
  { id: "f-jardinero", desc: "Jardinero Cristian", cat: "Hogar", pago: "Transferencia", monto: 80000 },
  { id: "f-limpieza", desc: "Limpieza Mabel", cat: "Hogar", pago: "Efectivo", monto: 500000 },
  { id: "f-ninera", desc: "Niñera Juli", cat: "Vicente", pago: "Transferencia", monto: 400000 },
  { id: "f-edea", desc: "EDEA (luz)", cat: "Hogar", pago: "Tarjeta de Crédito", tarjeta: "Banco Provincia", monto: 77525.87 },
  { id: "f-camuzzi", desc: "Camuzzi (gas)", cat: "Hogar", pago: "Tarjeta de Crédito", tarjeta: "Banco Provincia", monto: 134414.31 },
  { id: "f-sancor", desc: "Prevención Sancor", cat: "Seguros", pago: "Tarjeta de Crédito", tarjeta: "Santander Río", monto: 77763.97 },
];

const KEY = "mis-finanzas-v2";
const vacio = () => ({ movs: [], deudas: [], metas: [], cousteau: [], empresa: [], fijos: FIJOS_BASE, categorias: categoriasBase(), medios: mediosBase(), tarjetas: tarjetasBase() });
function cargar() {

    localStorage.removeItem("mis-finanzas-v1");
    const raw = localStorage.getItem(KEY);
    if (raw) return { ...vacio(), ...JSON.parse(raw) };
  } catch (e) {}

}

/* ---------- sincronización con Google Sheets (vía Apps Script) ---------- */
const CFG_KEY = "mis-finanzas-sheets";
const PEND_KEY = "mis-finanzas-pendiente";
const EN_ARTIFACT = (() => { try { return window.self !== window.top; } catch (e) { return true; } })();
const leerCfg = () => { try { return JSON.parse(localStorage.getItem(CFG_KEY)) || null; } catch (e) { return null; } };
const guardarCfg = (c) => { try { c ? localStorage.setItem(CFG_KEY, JSON.stringify(c)) : localStorage.removeItem(CFG_KEY); } catch (e) {} };
const marcarPendiente = (v) => { try { v ? localStorage.setItem(PEND_KEY, "1") : localStorage.removeItem(PEND_KEY); } catch (e) {} };
const hayPendiente = () => { try { return localStorage.getItem(PEND_KEY) === "1"; } catch (e) { return false; } };
const aBool = (v) => v === true || v === "TRUE" || v === "true" || v === 1;
const aNum = (v) => { const n = typeof v === "number" ? v : parseFloat(String(v ?? "").replace(",", ".")); return isNaN(n) ? 0 : n; };
const aTxt = (v) => (v == null ? "" : String(v));

const ENCABEZADOS = {
  Movimientos: ["id", "fecha", "tipo", "monto", "detalle", "categoria", "medio", "tarjeta", "cuota", "cuotas_total", "fijo", "fijo_ref"],
  Deudas: ["id", "fecha", "tipo", "persona", "detalle", "total", "pagado"],
  Ahorros: ["id", "nombre", "objetivo", "actual", "limite"],
  Cousteau: ["id", "fecha", "tipo", "monto", "detalle", "medio"],
  Empresa: ["id", "fecha", "monto", "detalle", "categoria"],
  Fijos: ["id", "detalle", "categoria", "medio", "tarjeta", "monto"],
  Medios: ["id", "nombre", "icono"],
  Categorias: ["id", "nombre", "tipo", "icono", "color"],
  Tarjetas: ["id", "nombre", "color"],
};
const aSheets = (d) => ({
  Movimientos: d.movs.map((m) => ({ id: m.id, fecha: m.fecha, tipo: m.tipo, monto: m.monto, detalle: m.desc, categoria: m.cat, medio: m.pago, tarjeta: m.tarjeta || "",
    cuota: m.cuota ? m.cuota.n : "", cuotas_total: m.cuota ? m.cuota.de : "", fijo: !!m.fijo, fijo_ref: m.fijoRef || "" })),
  Deudas: d.deudas.map((x) => ({ id: x.id, fecha: x.fecha, tipo: x.tipo, persona: x.persona, detalle: x.detalle || "", total: x.total, pagado: x.pagado })),
  Ahorros: d.metas.map((x) => ({ id: x.id, nombre: x.nombre, objetivo: x.objetivo, actual: x.actual, limite: x.limite || "" })),
  Cousteau: d.cousteau.map((x) => ({ id: x.id, fecha: x.fecha, tipo: x.tipo, monto: x.monto, detalle: x.detalle || "", medio: x.medio || "" })),
  Empresa: d.empresa.map((x) => ({ id: x.id, fecha: x.fecha, monto: x.monto, detalle: x.detalle, categoria: x.cat })),
  Fijos: d.fijos.map((x) => ({ id: x.id, detalle: x.desc, categoria: x.cat, medio: x.pago, tarjeta: x.tarjeta || "", monto: x.monto })),
  Medios: (d.medios || []).map((x) => ({ id: x.key, nombre: x.id, icono: x.icon })),
  Categorias: (d.categorias || []).map((x) => ({ id: x.key, nombre: x.id, tipo: x.tipo, icono: x.icon, color: x.color })),
  Tarjetas: (d.tarjetas || []).map((x) => ({ id: x.key, nombre: x.id, color: x.color })),
});
const deSheets = (s) => {
  const g = (k) => (Array.isArray(s[k]) ? s[k] : []).filter((r) => r && r.id !== "" && r.id != null);
  return {
    movs: g("Movimientos").map((r) => {
      const de = aNum(r.cuotas_total);
      return { id: aTxt(r.id), fecha: aTxt(r.fecha), tipo: aTxt(r.tipo), monto: aNum(r.monto), desc: aTxt(r.detalle), cat: aTxt(r.categoria), pago: aTxt(r.medio),
        tarjeta: aTxt(r.tarjeta) || null, cuota: de > 1 ? { n: aNum(r.cuota), de } : null, fijo: aBool(r.fijo), fijoRef: aTxt(r.fijo_ref) || undefined };
    }),
    deudas: g("Deudas").map((r) => ({ id: aTxt(r.id), fecha: aTxt(r.fecha), tipo: aTxt(r.tipo), persona: aTxt(r.persona), detalle: aTxt(r.detalle), total: aNum(r.total), pagado: aNum(r.pagado) })),
    metas: g("Ahorros").map((r) => ({ id: aTxt(r.id), nombre: aTxt(r.nombre), objetivo: aNum(r.objetivo), actual: aNum(r.actual), limite: aTxt(r.limite) })),
    cousteau: g("Cousteau").map((r) => ({ id: aTxt(r.id), fecha: aTxt(r.fecha), tipo: aTxt(r.tipo), monto: aNum(r.monto), detalle: aTxt(r.detalle), medio: aTxt(r.medio) })),
    empresa: g("Empresa").map((r) => ({ id: aTxt(r.id), fecha: aTxt(r.fecha), monto: aNum(r.monto), detalle: aTxt(r.detalle), cat: aTxt(r.categoria) })),
    fijos: g("Fijos").map((r) => ({ id: aTxt(r.id), desc: aTxt(r.detalle), cat: aTxt(r.categoria), pago: aTxt(r.medio), tarjeta: aTxt(r.tarjeta) || null, monto: aNum(r.monto) })),
    medios: g("Medios").map((r) => ({ key: aTxt(r.id), id: aTxt(r.nombre), icon: aTxt(r.icono) || "Wallet" })),
    categorias: g("Categorias").map((r) => ({ key: aTxt(r.id), id: aTxt(r.nombre), tipo: aTxt(r.tipo) === "ingreso" ? "ingreso" : "egreso", icon: aTxt(r.icono) || "Package", color: aTxt(r.color) || "#8E9A94" })),
    tarjetas: g("Tarjetas").map((r) => ({ key: aTxt(r.id), id: aTxt(r.nombre), color: aTxt(r.color) || "#5B6B73", icon: "CreditCard" })),
  };
};
async function llamarSheets(c, cuerpo) {
  let r;
  if (cuerpo) {
    r = await fetch(c.url, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ clave: c.clave, ...cuerpo }) });
  } else {
    r = await fetch(c.url + (c.url.includes("?") ? "&" : "?") + "clave=" + encodeURIComponent(c.clave) + "&t=" + Date.now());
  }
  let j;
  try { j = await r.json(); } catch (e) { throw new Error("La URL no responde como esperaba. Revisá que sea la de la implementación (termina en /exec)."); }
  if (!j.ok) throw new Error(j.error || "Error desconocido");
  return j;
}
const mensajeError = (e) => /fetch|network|load failed/i.test(String(e && e.message)) ? "No se pudo conectar. Revisá internet o la URL." : String((e && e.message) || e);

function FormSheets({ cfg, onConectar, onDesconectar }) {
  const [url, setUrl] = useState(cfg ? cfg.url : "");
  const [clave, setClave] = useState(cfg ? cfg.clave : "");
  const [estado, setEstado] = useState("");
  const [err, setErr] = useState("");
  const [confirmar, setConfirmar] = useState(false);
  const conectar = async () => {
    const c = { url: url.trim(), clave: clave.trim() };
    if (!/^https:\/\/script\.google\.com\/.+\/exec$/.test(c.url)) return setErr("Pegá la URL de la aplicación web. Empieza con https://script.google.com/ y termina en /exec");
    if (!c.clave) return setErr("Escribí la clave que pusiste en el código de Apps Script");
    setErr(""); setEstado("Probando conexión…");
    try { await llamarSheets(c); setEstado(""); onConectar(c); }
    catch (e) { setEstado(""); setErr(mensajeError(e)); }
  };
  return (
    <div className="flex flex-col gap-4">
      <p className="text-sm text-muted">Con esto tus datos se guardan en tu planilla de Google y los podés ver desde cualquier dispositivo.</p>
      <Campo label="URL de Apps Script" htmlFor="cfg-url">
        <textarea id="cfg-url" rows="3" className="field text-sm break-all" placeholder="https://script.google.com/macros/s/…/exec" value={url} onChange={(e) => { setUrl(e.target.value); setErr(""); }} />
      </Campo>

        <input id="cfg-clave" className="field" autoCapitalize="off" autoCorrect="off" value={clave} onChange={(e) => { setClave(e.target.value); setErr(""); }} />

      {err && <p className="text-sm text-exp font-medium" role="alert">{err}</p>}
      <button type="button" onClick={conectar} className="h-14 rounded-2xl font-bold bg-brand text-brandink flex items-center justify-center gap-2"><Ic n="Cloud" />{cfg ? "Guardar y reconectar" : "Conectar"}</button>

      ))}
    </div>
  );
}

/* ---------- colores de gráfico según tema ---------- */
function useTokens() {
  const leer = () => {
    const cs = getComputedStyle(document.documentElement);
    const g = (k) => cs.getPropertyValue(k).trim();
    return { ink: g("--ink"), muted: g("--muted"), line: g("--line"), inc: g("--inc"), exp: g("--exp"), surface: g("--surface") };
  };
  const [t, setT] = useState(leer);
  useEffect(() => {
    const f = () => setT(leer());
    const mq = window.matchMedia("(prefers-color-scheme: dark)");
    mq.addEventListener ? mq.addEventListener("change", f) : mq.addListener(f);
    const mo = new MutationObserver(f);
    mo.observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
    return () => { mq.removeEventListener ? mq.removeEventListener("change", f) : mq.removeListener(f); mo.disconnect(); };
  }, []);
  return t;
}

/* ---------- piezas comunes ---------- */
function Sheet({ title, onClose, children }) {
  useEffect(() => {
    const k = (e) => e.key === "Escape" && onClose();
    window.addEventListener("keydown", k);
    return () => window.removeEventListener("keydown", k);
  }, []);
  return (
    <div className="fixed inset-0 z-50 flex items-end justify-center" role="dialog" aria-modal="true" aria-label={title}>
      <div className="absolute inset-0 bg-black/40" onClick={onClose} />
      <div className="sheet-in relative w-full max-w-md bg-surface rounded-t-3xl max-h-[92%] overflow-y-auto"
        style={{ paddingBottom: "calc(20px + env(safe-area-inset-bottom, 0px))" }}>
        <div className="sticky top-0 bg-surface z-10 px-5 pt-3 pb-3 border-b border-line">
          <div className="mx-auto mb-3 h-1 w-10 rounded-full bg-line" />
          <div className="flex items-center justify-between">
            <h2 className="display text-xl font-bold">{title}</h2>
            <button onClick={onClose} className="h-9 w-9 grid place-items-center rounded-full bg-surface2 text-muted" aria-label="Cerrar"><Ic n="X" /></button>
          </div>
        </div>
        <div className="px-5 pt-4">{children}</div>
      </div>
    </div>
  );
}

function Segmento({ value, onChange, options }) {

    <div className="grid gap-1 p-1 rounded-2xl bg-surface2 border border-line" style={{ gridTemplateColumns: `repeat(${options.length},1fr)` }}>
      {options.map((o) => {
        const on = value === o.value;
        return (
          <button key={o.value} type="button" onClick={() => onChange(o.value)}
            className={`py-2.5 rounded-xl text-sm font-semibold flex items-center justify-center gap-1.5 transition ${on ? o.activeCls : "text-muted"}`}>
            {o.icon && <Ic n={o.icon} size={16} />}{o.label}
          </button>

const Campo = ({ label, htmlFor, children, hint }) => (

/* ---------- formulario de movimiento ---------- */
function AgregarRapido({ label, onAdd, existe }) {
  const [abierto, setAbierto] = useState(false);
  const [txt, setTxt] = useState("");
  const [err, setErr] = useState("");
  const ok = () => {
    const n = txt.trim();
    if (!n) return setErr("Escribí un nombre");
    if (existe(n)) return setErr("Ya existe");
    onAdd(n); setTxt(""); setAbierto(false); setErr("");
  };
  if (!abierto) return (
    <button type="button" onClick={() => setAbierto(true)} className="flex items-center gap-1.5 px-3 py-2 rounded-full border border-dashed border-line text-sm font-medium text-muted"><Ic n="Plus" size={15} />{label}</button>
  );
  return (
    <div className="w-full flex flex-col gap-1.5">
      <div className="flex gap-2">
        <input autoFocus className="field flex-1 min-w-0 py-2" placeholder="Nombre" value={txt} onChange={(e) => { setTxt(e.target.value); setErr(""); }}
          onKeyDown={(e) => { if (e.key === "Enter") { e.preventDefault(); ok(); } }} aria-label={label} />
        <button type="button" onClick={ok} className="px-3.5 rounded-xl bg-brand text-brandink font-semibold text-sm">Agregar</button>
        <button type="button" onClick={() => { setAbierto(false); setErr(""); }} className="px-3 rounded-xl bg-surface2 border border-line text-sm" aria-label="Cancelar"><Ic n="X" size={16} /></button>
      </div>
      {err && <p className="text-xs text-exp font-medium">{err}</p>}
    </div>
  );
}
const existeEn = (lista) => (n) => lista.some((x) => x.id.trim().toLowerCase() === n.toLowerCase());

function FormMovimiento({ onSave, inicial, onAgregarCat, onAgregarMedio }) {
  const i = inicial || {};
  const [tipo, setTipo] = useState(i.tipo || "egreso");
  const [monto, setMonto] = useState(i.monto ? fmtPlano.format(i.monto) : "");
  const [desc, setDesc] = useState(i.desc || "");
  const [cat, setCat] = useState(i.cat || (CAT_EGRESO[0] || {}).id || "");
  const [pago, setPago] = useState(i.pago || "Tarjeta de Crédito");
  const [tarjeta, setTarjeta] = useState(i.tarjeta || TARJETAS[0].id);
  const [cuotaN, setCuotaN] = useState(i.cuota ? String(i.cuota.n) : "1");
  const [cuotaDe, setCuotaDe] = useState(i.cuota ? String(i.cuota.de) : "1");
  const [fijo, setFijo] = useState(!!i.fijo);
  const [fecha, setFecha] = useState(i.fecha || toISO(new Date()));
  const [err, setErr] = useState("");
  const ing = tipo === "ingreso";
  const cats = ing ? CAT_INGRESO : CAT_EGRESO;
  const credito = !ing && pago === "Tarjeta de Crédito";
  const primerMedio = (pref) => (PAGOS.some((p) => p.id === pref) ? pref : (PAGOS[0] || {}).id || "");
  const cambiarTipo = (t) => { setTipo(t); setCat(((t === "ingreso" ? CAT_INGRESO : CAT_EGRESO)[0] || {}).id || ""); setPago(t === "ingreso" ? primerMedio("Transferencia") : CREDITO); };
  const guardar = (e) => {
    e.preventDefault();
    const n = parseMonto(monto);
    if (!(n > 0)) return setErr("Ingresá un monto mayor a cero, por ejemplo 15.000 o 77.525,87");
    if (!fecha) return setErr("Elegí una fecha");
    let cuota = null;
    if (credito) {
      const a = parseInt(cuotaN, 10), b = parseInt(cuotaDe, 10);
      if (!(a >= 1 && b >= 1 && a <= b)) return setErr("Revisá la cuota: por ejemplo 4 de 6");
      if (b > 1) cuota = { n: a, de: b };
    }
    onSave({ ...i, id: i.id || uid(), tipo, monto: n, desc: desc.trim() || cat, cat, pago, tarjeta: credito ? tarjeta : null, cuota, fijo: !ing && fijo, fecha });
  };
  return (
    <form onSubmit={guardar} className="flex flex-col gap-5">
      <Segmento value={tipo} onChange={cambiarTipo} options={[
        { value: "egreso", label: "Egreso", icon: "ArrowUpRight", activeCls: "bg-exp text-white shadow-sm" },
        { value: "ingreso", label: "Ingreso", icon: "ArrowDownLeft", activeCls: "bg-inc text-white shadow-sm" },
      ]} />
      <div className="flex flex-col items-center gap-1">
        <label htmlFor="mov-monto" className="label">{credito && cuotaDe > 1 ? "Monto de la cuota" : "Monto"}</label>
        <div className="flex items-baseline gap-1">
          <span className={`display text-3xl font-bold ${ing ? "text-inc" : "text-exp"}`}>$</span>
          <input id="mov-monto" autoFocus inputMode="decimal" placeholder="0" value={monto}
            onChange={(e) => { setMonto(e.target.value); setErr(""); }}
            className="num display text-4xl font-bold bg-transparent outline-none w-52 text-center border-b-2 border-line focus:border-brand pb-1" />
        </div>
      </div>
      <Campo label="Detalle" htmlFor="mov-desc">
        <input id="mov-desc" className="field" placeholder={ing ? "Ej: Sueldo de octubre" : "Ej: Universidad Siglo 21"} value={desc} onChange={(e) => setDesc(e.target.value)} />
      </Campo>
      <Campo label="Categoría" htmlFor="mov-cat">
        <div className="grid grid-cols-4 gap-2" id="mov-cat">
          {cats.map((c) => {
            const on = cat === c.id;
            return (
              <button type="button" key={c.id} onClick={() => setCat(c.id)}
                className={`flex flex-col items-center gap-1 py-2.5 px-1 rounded-2xl border text-[11px] font-semibold leading-tight transition ${on ? "border-transparent" : "border-line bg-surface2 text-muted"}`}
                style={on ? { background: c.color + "26", color: c.color, boxShadow: `inset 0 0 0 2px ${c.color}` } : {}}>
                <Ic n={c.icon} size={20} />{c.id}
              </button>
            );
          })}
        </div>
        {onAgregarCat && <div className="mt-1"><AgregarRapido label="Nueva categoría" existe={existeEn(cats)} onAdd={(n) => { onAgregarCat(tipo, n); setCat(n); }} /></div>}
      </Campo>
      <Campo label="Medio de pago" htmlFor="mov-pago">
        <div className="flex flex-wrap gap-2" id="mov-pago">
          {PAGOS.map((p) => {
            const on = pago === p.id;
            return (
              <button type="button" key={p.id} onClick={() => setPago(p.id)}
                className={`flex items-center gap-1.5 px-3 py-2 rounded-full border text-sm font-medium transition ${on ? "bg-brand text-brandink border-brand" : "bg-surface2 border-line text-ink"}`}>
                <Ic n={p.icon} size={15} />{p.id}
              </button>
            );
          })}
          {onAgregarMedio && <AgregarRapido label="Nuevo medio" existe={existeEn(PAGOS)} onAdd={(n) => { onAgregarMedio(n); setPago(n); }} />}
        </div>
      </Campo>
      {credito && (
        <div className="rounded-2xl border border-line bg-surface2 p-3.5 flex flex-col gap-3">
          <Campo label="Tarjeta" htmlFor="mov-tarjeta">
            <div className="grid grid-cols-3 gap-2" id="mov-tarjeta">
              {TARJETAS.map((t) => (
                <button type="button" key={t.id} onClick={() => setTarjeta(t.id)}
                  className={`py-2.5 rounded-xl border text-sm font-semibold transition ${tarjeta === t.id ? "text-white border-transparent" : "bg-surface border-line"}`}
                  style={tarjeta === t.id ? { background: t.color } : {}}>{t.id}</button>
              ))}
            </div>
          </Campo>
          <Campo label="Cuota" htmlFor="mov-cuota-n" hint="Dejá 1 de 1 si fue en un pago. Las cuotas siguientes te aparecen solas en Inicio para cargarlas cada mes.">
            <div className="flex items-center gap-2">
              <input id="mov-cuota-n" inputMode="numeric" className="field num text-center w-20" value={cuotaN} onChange={(e) => { setCuotaN(e.target.value.replace(/\D/g, "")); setErr(""); }} />
              <span className="text-muted font-semibold">de</span>
              <input id="mov-cuota-de" inputMode="numeric" className="field num text-center w-20" value={cuotaDe} onChange={(e) => { setCuotaDe(e.target.value.replace(/\D/g, "")); setErr(""); }} />
            </div>
          </Campo>
        </div>
      )}
      {!ing && (
        <Campo label="Tipo de gasto" htmlFor="mov-fijo">
          <Segmento value={fijo ? "fijo" : "variable"} onChange={(v) => setFijo(v === "fijo")} options={[
            { value: "variable", label: "Variable", activeCls: "bg-surface text-ink shadow-sm" },
            { value: "fijo", label: "Fijo", activeCls: "bg-surface text-cou shadow-sm" },
          ]} />
        </Campo>
      )}
      <Campo label="Fecha" htmlFor="mov-fecha">
        <input id="mov-fecha" type="date" className="field" value={fecha} onChange={(e) => setFecha(e.target.value)} />
      </Campo>
      {err && <p className="text-sm text-exp font-medium" role="alert">{err}</p>}
      <button type="submit" className={`h-14 rounded-2xl font-bold text-white text-base flex items-center justify-center gap-2 ${ing ? "bg-inc" : "bg-exp"}`}>
        <Ic n="Check" /> {i.id ? "Guardar cambios" : `Guardar ${ing ? "ingreso" : "egreso"}`}
      </button>
    </form>
  );
}

/* ---------- carga de gastos fijos del mes ---------- */
function FormFijos({ fijos, movs, onLoad, onTemplate }) {
  const mk = monthKey(new Date());
  const cargados = new Set(movs.filter((m) => m.fecha.startsWith(mk) && m.fijoRef).map((m) => m.fijoRef));
  const [filas, setFilas] = useState(() => fijos.map((f) => ({ ...f, sel: !cargados.has(f.id), txt: fmtPlano.format(f.monto) })));
  const [fecha, setFecha] = useState(toISO(new Date()));
  const [nuevo, setNuevo] = useState(null);
  const [err, setErr] = useState("");
  const set = (id, patch) => setFilas((fs) => fs.map((f) => (f.id === id ? { ...f, ...patch } : f)));
  const elegidos = filas.filter((f) => f.sel);
  const total = sum(elegidos, (f) => parseMonto(f.txt));

  const cargar = () => {
    const malos = elegidos.filter((f) => !(parseMonto(f.txt) > 0));
    if (malos.length) return setErr(`Revisá el monto de ${malos[0].desc}`);
    if (!elegidos.length) return setErr("Marcá al menos un gasto");
    const nuevosMovs = elegidos.map((f) => ({
      id: uid(), tipo: "egreso", monto: parseMonto(f.txt), desc: f.desc, cat: f.cat, pago: f.pago,
      tarjeta: f.pago === "Tarjeta de Crédito" ? f.tarjeta || TARJETAS[0].id : null, cuota: null, fijo: true, fijoRef: f.id, fecha,
    }));
    const plantilla = filas.map(({ sel, txt, ...f }) => ({ ...f, monto: parseMonto(txt) > 0 ? parseMonto(txt) : f.monto }));
    onLoad(nuevosMovs, plantilla);
  };
  const quitar = (id) => { setFilas((fs) => fs.filter((f) => f.id !== id)); onTemplate((t) => t.filter((f) => f.id !== id)); };
  const agregar = () => {
    const n = parseMonto(nuevo.txt);
    if (!nuevo.desc.trim()) return setErr("Escribí el nombre del gasto fijo");
    if (!(n > 0)) return setErr("Escribí un monto de referencia");
    const f = { id: "f-" + uid(), desc: nuevo.desc.trim(), cat: nuevo.cat, pago: nuevo.pago, tarjeta: nuevo.pago === "Tarjeta de Crédito" ? nuevo.tarjeta : null, monto: n };
    onTemplate((t) => [...t, f]);
    setFilas((fs) => [...fs, { ...f, sel: true, txt: fmtPlano.format(n) }]);
    setNuevo(null); setErr("");
  };

  return (
    <div className="flex flex-col gap-4">
      <p className="text-sm text-muted">Los montos son los últimos que usaste. Corregí lo que haya cambiado, destildá lo que no corresponda y cargalos juntos.</p>
      <ul className="flex flex-col gap-2">
        {filas.map((f) => {
          const ya = cargados.has(f.id);
          return (
            <li key={f.id} className={`rounded-2xl border p-3 flex items-center gap-3 ${f.sel ? "border-brand bg-brandsoft" : "border-line bg-surface2"}`}>
              <button type="button" onClick={() => set(f.id, { sel: !f.sel })} aria-pressed={f.sel} aria-label={`Incluir ${f.desc}`}
                className={`h-6 w-6 rounded-md border-2 grid place-items-center shrink-0 ${f.sel ? "bg-brand border-brand text-brandink" : "border-line bg-surface"}`}>
                {f.sel && <Ic n="Check" size={14} />}
              </button>
              <div className="min-w-0 flex-1">
                <p className="font-semibold text-sm truncate">{f.desc}</p>
                <p className="text-[11px] text-muted truncate">{f.cat} · {f.pago === "Tarjeta de Crédito" ? f.tarjeta : f.pago}{ya ? " · ya cargado este mes" : ""}</p>
              </div>
              <input id={`fijo-${f.id}`} inputMode="decimal" aria-label={`Monto ${f.desc}`} value={f.txt} onChange={(e) => { set(f.id, { txt: e.target.value }); setErr(""); }}
                className="num w-28 text-right bg-surface border border-line rounded-xl px-2.5 py-2 text-sm font-semibold outline-none focus:border-brand" />
              <BorrarBtn onConfirm={() => quitar(f.id)} />
            </li>
          );
        })}
      </ul>

      {nuevo ? (
        <div className="rounded-2xl border border-line p-3.5 flex flex-col gap-3">
          <input id="fn-desc" className="field" placeholder="Nombre. Ej: Internet Fibertel" value={nuevo.desc} onChange={(e) => setNuevo({ ...nuevo, desc: e.target.value })} />
          <div className="grid grid-cols-2 gap-2">
            <select id="fn-cat" className="field" value={nuevo.cat} onChange={(e) => setNuevo({ ...nuevo, cat: e.target.value })}>
              {CAT_EGRESO.map((c) => <option key={c.id}>{c.id}</option>)}
            </select>
            <input id="fn-monto" inputMode="decimal" className="field num" placeholder="Monto" value={nuevo.txt} onChange={(e) => setNuevo({ ...nuevo, txt: e.target.value })} />
          </div>
          <select id="fn-pago" className="field" value={nuevo.pago === "Tarjeta de Crédito" ? "TC|" + nuevo.tarjeta : nuevo.pago}
            onChange={(e) => { const v = e.target.value; v.startsWith("TC|") ? setNuevo({ ...nuevo, pago: "Tarjeta de Crédito", tarjeta: v.slice(3) }) : setNuevo({ ...nuevo, pago: v }); }}>
            {PAGOS.filter((p) => p.id !== "Tarjeta de Crédito").map((p) => <option key={p.id} value={p.id}>{p.id}</option>)}
            {TARJETAS.map((t) => <option key={t.id} value={"TC|" + t.id}>Tarjeta {t.id}</option>)}
          </select>
          <div className="flex gap-2">
            <button type="button" onClick={agregar} className="flex-1 h-11 rounded-xl bg-brand text-brandink font-semibold">Agregar a mis fijos</button>
            <button type="button" onClick={() => setNuevo(null)} className="px-4 h-11 rounded-xl bg-surface2 border border-line font-semibold">Cancelar</button>
          </div>
        </div>
      ) : (
        <button type="button" onClick={() => setNuevo({ desc: "", cat: (CAT_EGRESO[0] || {}).id || "", pago: (PAGOS.find((p) => p.id !== CREDITO) || {}).id || CREDITO, tarjeta: TARJETAS[0].id, txt: "" })}
          className="h-11 rounded-xl border-2 border-dashed border-line text-muted font-semibold text-sm flex items-center justify-center gap-2"><Ic n="Plus" size={16} />Agregar otro gasto fijo</button>
      )}

      <Campo label="Fecha de carga" htmlFor="fijos-fecha">
        <input id="fijos-fecha" type="date" className="field" value={fecha} onChange={(e) => setFecha(e.target.value)} />
      </Campo>
      {err && <p className="text-sm text-exp font-medium" role="alert">{err}</p>}
      <button type="button" onClick={cargar} className="h-14 rounded-2xl font-bold text-white bg-exp flex items-center justify-center gap-2">
        <Ic n="Check" /> Cargar {elegidos.length} {elegidos.length === 1 ? "gasto" : "gastos"} · <span className="num">{money(total)}</span>
      </button>
    </div>
  );
}

/* ---------- Dashboard ---------- */
function Dashboard({ data, ir, abrir, onEdit, onDelete }) {
  const tk = useTokens();
  const hoy = new Date();
  const mk = monthKey(hoy);
  const { movs, deudas, metas, cousteau, fijos, empresa } = data;
  const empMes = sum(empresa.filter((e) => e.fecha.startsWith(mk)));
  const cuotasPend = cuotasActivas(movs, hoy).filter((a) => !a.cargadaEsteMes);

  const ingTot = sum(movs.filter((m) => m.tipo === "ingreso"));
  const egrTot = sum(movs.filter((m) => m.tipo === "egreso"));
  const aportes = sum(cousteau.filter((c) => c.tipo === "aporte"));
  const devol = sum(cousteau.filter((c) => c.tipo === "devolucion"));
  const balance = ingTot - egrTot - aportes + devol;
  const cousteauDebe = aportes - devol;

  const delMes = movs.filter((m) => m.fecha.startsWith(mk));
  const egrMesL = delMes.filter((m) => m.tipo === "egreso");
  const ingMes = sum(delMes.filter((m) => m.tipo === "ingreso"));
  const egrMes = sum(egrMesL);
  const fijoMes = sum(egrMesL.filter((m) => m.fijo));
  const enMetas = sum(metas, (m) => m.actual);
  const debo = sum(deudas.filter((d) => d.tipo === "debo"), (d) => Math.max(0, d.total - d.pagado));
  const meDeben = sum(deudas.filter((d) => d.tipo === "meDeben"), (d) => Math.max(0, d.total - d.pagado));
  const fijosCargados = new Set(delMes.filter((m) => m.fijoRef).map((m) => m.fijoRef));
  const fijosPend = fijos.filter((f) => !fijosCargados.has(f.id)).length;

  const torta = useMemo(() => {
    const g = {};
    egrMesL.forEach((m) => { g[m.cat] = (g[m.cat] || 0) + m.monto; });
    return Object.entries(g).map(([name, value]) => ({ name, value, color: (CATS[name] || {}).color || "#8E9A94" })).sort((a, b) => b.value - a.value);
  }, [movs]);

  const tarjetas = TARJETAS.map((t) => {
    const items = egrMesL.filter((m) => m.pago === "Tarjeta de Crédito" && m.tarjeta === t.id);
    return { ...t, total: sum(items), n: items.length, cuotas: items.filter((m) => m.cuota).length };
  });

  const barras = useMemo(() => {
    const out = [];
    for (let i = 5; i >= 0; i--) {
      const d = new Date(hoy.getFullYear(), hoy.getMonth() - i, 1);
      const ms = movs.filter((m) => m.fecha.startsWith(monthKey(d)));
      out.push({ mes: MESES[d.getMonth()], Ingresos: sum(ms.filter((m) => m.tipo === "ingreso")), Egresos: sum(ms.filter((m) => m.tipo === "egreso")) });
    }
    return out;
  }, [movs]);
  const hayBarras = barras.some((b) => b.Ingresos || b.Egresos);

  const ultimos = [...movs].sort((a, b) => b.fecha.localeCompare(a.fecha)).slice(0, 5);
  const ttStyle = { background: tk.surface, border: `1px solid ${tk.line}`, borderRadius: 12, color: tk.ink, fontSize: 13 };
  const mesNombre = MESES_L[hoy.getMonth()];

  return (
    <div className="flex flex-col gap-4">
      <section className="rounded-3xl p-5 bg-brand text-brandink relative overflow-hidden">
        <svg className="absolute -right-6 -bottom-8 opacity-15" width="170" height="170" viewBox="0 0 100 100" aria-hidden="true">
          <circle cx="50" cy="50" r="46" fill="none" stroke="currentColor" strokeWidth="6" />
          <circle cx="50" cy="50" r="30" fill="none" stroke="currentColor" strokeWidth="6" />
          <circle cx="50" cy="50" r="14" fill="currentColor" />
        </svg>
        <p className="text-xs uppercase tracking-[.1em] font-semibold opacity-80">Balance total</p>
        <p className="num display text-[2.3rem] leading-tight font-bold mt-1">{money(balance)}</p>
        <p className="text-sm opacity-85 mt-1">Ingresos menos egresos y lo puesto en Cousteau</p>
        {enMetas > 0 && <p className="text-sm opacity-85 mt-0.5 flex items-center gap-1.5"><Ic n="PiggyBank" size={15} /> {money(enMetas)} apartados en metas</p>}
      </section>

      <div className="grid grid-cols-2 gap-3">
        <div className="rounded-2xl bg-surface border border-line p-4">
          <div className="flex items-center gap-2 text-inc"><span className="h-7 w-7 grid place-items-center rounded-full bg-incsoft"><Ic n="ArrowDownLeft" size={16} /></span><span className="label">Ingresos</span></div>
          <p className="num display text-xl font-bold mt-2.5 break-words">{money(ingMes)}</p>
          <p className="text-xs text-muted mt-0.5">en {mesNombre}</p>
        </div>
        <div className="rounded-2xl bg-surface border border-line p-4">
          <div className="flex items-center gap-2 text-exp"><span className="h-7 w-7 grid place-items-center rounded-full bg-expsoft"><Ic n="ArrowUpRight" size={16} /></span><span className="label">Egresos</span></div>
          <p className="num display text-xl font-bold mt-2.5 break-words">{money(egrMes)}</p>
          <p className="text-xs text-muted mt-0.5">{egrMes > 0 ? `${money(fijoMes)} fijos` : `en ${mesNombre}`}</p>
        </div>
      </div>

      {empMes > 0 && (
        <button onClick={() => ir("empresa")} className="rounded-2xl bg-surface border border-line px-4 py-3 text-left flex flex-col gap-2">
          <div className="flex items-baseline justify-between gap-2">
            <span className="label">Costo de vida de {mesNombre}</span>
            <span className="num display font-bold text-lg">{money(egrMes + empMes)}</span>
          </div>
          <div className="h-2.5 rounded-full overflow-hidden flex bg-surface2">
            <div style={{ width: `${(egrMes / (egrMes + empMes)) * 100}%`, background: "var(--exp)" }} />
            <div style={{ width: `${(empMes / (egrMes + empMes)) * 100}%`, background: "var(--emp)" }} />
          </div>
          <p className="text-xs text-muted">Tus egresos más lo que pagó la empresa</p>

      {fijos.length > 0 && (
        <button onClick={() => abrir("fijos")} className={`rounded-2xl p-4 flex items-center gap-3 text-left border ${fijosPend ? "bg-surface border-brand" : "bg-surface border-line"}`}>

          <div className="flex-1 min-w-0">
            <p className="font-semibold">Gastos fijos de {mesNombre}</p>
            <p className="text-sm text-muted">{fijosPend ? `Te faltan cargar ${fijosPend} de ${fijos.length}` : "Ya cargaste todos"}</p>
          </div>
          {fijosPend > 0 && <span className="px-3 py-1.5 rounded-full bg-brand text-brandink text-sm font-semibold">Cargar</span>}

      )}

      {cuotasPend.length > 0 && (
        <button onClick={() => abrir("cuotas")} className="rounded-2xl p-4 flex items-center gap-3 text-left border bg-surface border-brand">
          <span className="h-10 w-10 grid place-items-center rounded-2xl bg-brandsoft text-brand shrink-0"><Ic n="CreditCard" size={20} /></span>
          <div className="flex-1 min-w-0">
            <p className="font-semibold">Cuotas de {mesNombre}</p>
            <p className="text-sm text-muted">Te faltan cargar {cuotasPend.length} · <span className="num">{money(sum(cuotasPend))}</span></p>
          </div>
          <span className="px-3 py-1.5 rounded-full bg-brand text-brandink text-sm font-semibold">Cargar</span>
        </button>
      )}

      <div className="grid grid-cols-2 gap-3">
        <button onClick={() => ir("cousteau")} className="rounded-2xl bg-cousoft p-4 text-left">
          <p className="label flex items-center gap-1.5" style={{ color: "var(--cou)" }}><Ic n="Store" size={14} />Cousteau te debe</p>
          <p className="num display text-lg font-bold mt-1.5 break-words">{money(cousteauDebe)}</p>
        </button>
        <button onClick={() => ir("empresa")} className="rounded-2xl bg-empsoft p-4 text-left">
          <p className="label flex items-center gap-1.5" style={{ color: "var(--emp)" }}><Ic n="Building2" size={14} />Pagó la empresa</p>
          <p className="num display text-lg font-bold mt-1.5 break-words">{money(empMes)}</p>
          <p className="text-xs text-muted mt-0.5">en {mesNombre}</p>
        </button>
      </div>
      <button onClick={() => ir("deudas")} className="rounded-2xl bg-surface border border-line px-4 py-3 flex items-center gap-3 text-left">
        <span className="h-9 w-9 grid place-items-center rounded-full bg-debtsoft text-debt shrink-0"><Ic n="HandCoins" size={18} /></span>
        <div className="flex-1 grid grid-cols-2 gap-2 text-sm min-w-0">
          <div className="min-w-0"><p className="text-muted text-xs">Debés</p><p className="num font-bold text-debt break-words">{money(debo)}</p></div>
          <div className="min-w-0"><p className="text-muted text-xs">Te deben</p><p className="num font-bold text-inc break-words">{money(meDeben)}</p></div>
        </div>
        <Ic n="ChevronRight" className="text-muted" />
      </button>

      <section className="rounded-3xl bg-surface border border-line p-5">
        <h2 className="display text-lg font-bold">¿A dónde se va la plata?</h2>
        <p className="text-sm text-muted">Egresos de {mesNombre} por rubro</p>
        {torta.length === 0 ? (
          <div className="py-8 text-center text-sm text-muted">
            <Ic n="PieChart" size={28} className="mx-auto mb-2" />
            Cuando cargues egresos de este mes vas a ver acá cómo se reparten.
          </div>
        ) : (
          <>
            <div className="relative h-56 mt-2">
              {PieChart && (
                <ResponsiveContainer width="100%" height="100%">
                  <PieChart>
                    <Pie data={torta} dataKey="value" nameKey="name" innerRadius="62%" outerRadius="92%" paddingAngle={2} stroke="none" isAnimationActive={false}>
                      {torta.map((t) => <Cell key={t.name} fill={t.color} />)}
                    </Pie>
                    <Tooltip formatter={(v) => money(v)} contentStyle={ttStyle} itemStyle={{ color: tk.ink }} />
                  </PieChart>
                </ResponsiveContainer>
              )}
              <div className="absolute inset-0 grid place-items-center pointer-events-none">
                <div className="text-center"><p className="label">Total</p><p className="num display font-bold text-lg">{money(egrMes)}</p></div>
              </div>
            </div>
            <ul className="mt-3 flex flex-col gap-2.5">
              {torta.map((t) => {
                const pct = egrMes ? (t.value / egrMes) * 100 : 0;
                return (
                  <li key={t.name} className="flex flex-col gap-1">
                    <div className="flex items-center gap-2 text-sm">
                      <span className="h-2.5 w-2.5 rounded-full shrink-0" style={{ background: t.color }} />

                      <span className="num text-muted w-10 text-right">{Math.round(pct)}%</span>

      <section className="rounded-3xl bg-surface border border-line p-5">

            <li key={t.id} className="flex items-center gap-3 rounded-2xl bg-surface2 border border-line p-3">
              <span className="h-9 w-12 rounded-lg grid place-items-center text-white shrink-0" style={{ background: t.color }}><Ic n="CreditCard" size={18} /></span>
              <div className="flex-1 min-w-0">
                <p className="font-semibold text-sm">{t.id}</p>
                <p className="text-xs text-muted">{t.n ? `${t.n} consumos${t.cuotas ? `, ${t.cuotas} en cuotas` : ""}` : "Sin consumos cargados"}</p>
              </div>
              <p className="num font-bold">{money(t.total)}</p>
            </li>
          ))}
        </ul>
      </section>

      <CuotasQueVienen movs={movs} tk={tk} />

      <section className="rounded-3xl bg-surface border border-line p-5">
        <div className="flex items-end justify-between gap-2 flex-wrap">
          <div>
            <h2 className="display text-lg font-bold">Ingresos vs egresos</h2>
            <p className="text-sm text-muted">Últimos 6 meses</p>
          </div>
          <div className="flex gap-3 text-xs font-semibold">
            <span className="flex items-center gap-1.5"><span className="h-2.5 w-2.5 rounded-sm bg-inc" />Ingresos</span>
            <span className="flex items-center gap-1.5"><span className="h-2.5 w-2.5 rounded-sm bg-exp" />Egresos</span>
          </div>
        </div>
        {hayBarras ? (
          <div className="h-56 mt-4 -ml-2">
            {BarChart && (
              <ResponsiveContainer width="100%" height="100%">
                <BarChart data={barras} barGap={3} barCategoryGap="22%">
                  <CartesianGrid vertical={false} stroke={tk.line} strokeDasharray="3 3" />
                  <XAxis dataKey="mes" tick={{ fill: tk.muted, fontSize: 12 }} axisLine={false} tickLine={false} />
                  <YAxis tick={{ fill: tk.muted, fontSize: 11 }} axisLine={false} tickLine={false} width={44} tickFormatter={(v) => fmtCompact.format(v)} />
                  <Tooltip formatter={(v) => money(v)} contentStyle={ttStyle} cursor={{ fill: tk.line, opacity: 0.35 }} labelStyle={{ color: tk.muted }} />
                  <Bar dataKey="Ingresos" fill={tk.inc} radius={[6, 6, 0, 0]} isAnimationActive={false} />
                  <Bar dataKey="Egresos" fill={tk.exp} radius={[6, 6, 0, 0]} isAnimationActive={false} />
                </BarChart>
              </ResponsiveContainer>
            )}
          </div>
        ) : (
          <div className="py-8 text-center text-sm text-muted"><Ic n="BarChart3" size={28} className="mx-auto mb-2" />Este gráfico se arma solo a medida que cargás meses.</div>
        )}
      </section>

      <section className="rounded-3xl bg-surface border border-line p-5">
        <div className="flex items-center justify-between">
          <h2 className="display text-lg font-bold">Últimos movimientos</h2>
          {ultimos.length > 0 && <button onClick={() => ir("historial")} className="text-sm font-semibold text-brand flex items-center gap-0.5">Ver todos <Ic n="ChevronRight" size={16} /></button>}
        </div>
        {ultimos.length ? <ul className="divide-y divide-line">{ultimos.map((m) => <FilaMov key={m.id} m={m} onEdit={onEdit} onDelete={onDelete} />)}</ul>
          : <p className="text-sm text-muted py-6 text-center">Cargá tu primer movimiento con el botón +</p>}
      </section>
    </div>
  );
}

/* ---------- Historial ---------- */
function Historial({ data, onDelete, onEdit, abrir }) {
  const hoy = new Date();
  const [ref, setRef] = useState(new Date(hoy.getFullYear(), hoy.getMonth(), 1));
  const [filtro, setFiltro] = useState("todos");
  const [q, setQ] = useState("");
  const mk = monthKey(ref);
  const delMes = data.movs.filter((m) => m.fecha.startsWith(mk));
  const ing = sum(delMes.filter((m) => m.tipo === "ingreso"));
  const egr = sum(delMes.filter((m) => m.tipo === "egreso"));
  const lista = delMes
    .filter((m) => filtro === "todos" || (filtro === "fijo" ? m.tipo === "egreso" && m.fijo : m.tipo === filtro))
    .filter((m) => !q || [m.desc, m.cat, m.pago, m.tarjeta || ""].join(" ").toLowerCase().includes(q.toLowerCase()))
    .sort((a, b) => b.fecha.localeCompare(a.fecha));
  const grupos = lista.reduce((acc, m) => { (acc[m.fecha] = acc[m.fecha] || []).push(m); return acc; }, {});
  const esActual = mk === monthKey(hoy);
  const mover = (n) => setRef(new Date(ref.getFullYear(), ref.getMonth() + n, 1));

  return (
    <div className="flex flex-col gap-4">
      <div className="flex items-center justify-between rounded-2xl bg-surface border border-line p-1.5">
        <button onClick={() => mover(-1)} className="h-10 w-10 grid place-items-center rounded-xl hover:bg-surface2" aria-label="Mes anterior"><Ic n="ChevronLeft" /></button>
        <p className="display font-bold capitalize">{MESES_L[ref.getMonth()]} {ref.getFullYear()}</p>
        <button onClick={() => mover(1)} disabled={esActual} className="h-10 w-10 grid place-items-center rounded-xl hover:bg-surface2 disabled:opacity-30" aria-label="Mes siguiente"><Ic n="ChevronRight" /></button>
      </div>
      <div className="grid grid-cols-3 gap-2 text-center">
        <div className="rounded-2xl bg-incsoft p-3 min-w-0"><p className="text-[11px] font-semibold text-inc uppercase tracking-wide">Entró</p><p className="num font-bold text-sm mt-1 break-words">{money(ing)}</p></div>
        <div className="rounded-2xl bg-expsoft p-3 min-w-0"><p className="text-[11px] font-semibold text-exp uppercase tracking-wide">Salió</p><p className="num font-bold text-sm mt-1 break-words">{money(egr)}</p></div>
        <div className="rounded-2xl bg-surface border border-line p-3 min-w-0"><p className="text-[11px] font-semibold text-muted uppercase tracking-wide">Neto</p><p className={`num font-bold text-sm mt-1 break-words ${ing - egr >= 0 ? "text-inc" : "text-exp"}`}>{money(ing - egr)}</p></div>
      </div>
      <div className="relative">
        <span className="absolute left-3.5 top-1/2 -translate-y-1/2 text-muted"><Ic n="Search" size={17} /></span>
        <input id="mov-buscar" className="field pl-10" placeholder="Buscar por detalle, rubro o tarjeta" value={q} onChange={(e) => setQ(e.target.value)} />
      </div>
      <p className="text-xs text-muted -mt-1 px-1">Tocá un movimiento para editarlo, o el tachito para eliminarlo.</p>
      <Segmento value={filtro} onChange={setFiltro} options={[
        { value: "todos", label: "Todos", activeCls: "bg-surface text-ink shadow-sm" },
        { value: "ingreso", label: "Ingresos", activeCls: "bg-surface text-inc shadow-sm" },
        { value: "egreso", label: "Egresos", activeCls: "bg-surface text-exp shadow-sm" },
        { value: "fijo", label: "Fijos", activeCls: "bg-surface text-cou shadow-sm" },
      ]} />
      {Object.keys(grupos).length === 0 ? (
        <Vacio icon="Receipt">
          <p>No hay movimientos para mostrar en este mes.</p>
          {esActual && <button onClick={() => abrir("fijos")} className="mt-3 px-4 py-2 rounded-full bg-brandsoft text-brand font-semibold">Cargar gastos fijos</button>}
        </Vacio>
      ) : Object.entries(grupos).map(([f, ms]) => {
        const d = new Date(f + "T12:00:00");
        const neto = ms.reduce((a, m) => a + (m.tipo === "ingreso" ? m.monto : -m.monto), 0);
        return (
          <section key={f} className="rounded-3xl bg-surface border border-line px-4 pt-3 pb-1">
            <div className="flex justify-between items-baseline">
              <p className="label">{DIAS[d.getDay()]} {fmtDate(f).slice(0, 5)}</p>
              <p className={`num text-xs font-semibold ${neto >= 0 ? "text-inc" : "text-exp"}`}>{neto >= 0 ? "+" : "−"}{money(Math.abs(neto))}</p>
            </div>
            <ul className="divide-y divide-line">{ms.map((m) => <FilaMov key={m.id} m={m} onDelete={onDelete} onEdit={onEdit} />)}</ul>
          </section>
        );
      })}
    </div>
  );
}

/* ---------- Cousteau ---------- */
function FormCousteau({ tipoInicial, pendiente, onSave }) {
  const [tipo, setTipo] = useState(tipoInicial);
  const [monto, setMonto] = useState("");
  const [detalle, setDetalle] = useState("");
  const [medio, setMedio] = useState("Transferencia");
  const [fecha, setFecha] = useState(toISO(new Date()));
  const [err, setErr] = useState("");
  const aporte = tipo === "aporte";
  const guardar = (e) => {
    e.preventDefault();
    const n = parseMonto(monto);
    if (!(n > 0)) return setErr("Ingresá un monto mayor a cero");
    if (!aporte && n > pendiente + 0.001) return setErr(`Cousteau te debe ${money(pendiente)}. La devolución no puede ser mayor.`);
    onSave({ id: uid(), tipo, monto: n, detalle: detalle.trim(), medio, fecha });
  };
  return (
    <form onSubmit={guardar} className="flex flex-col gap-5">
      <Segmento value={tipo} onChange={(t) => { setTipo(t); setErr(""); }} options={[
        { value: "aporte", label: "Puse plata", icon: "ArrowUpRight", activeCls: "bg-cou text-white shadow-sm" },
        { value: "devolucion", label: "Me devolvió", icon: "ArrowDownLeft", activeCls: "bg-inc text-white shadow-sm" },
      ]} />
      <div className="flex flex-col items-center gap-1">
        <label htmlFor="cou-monto" className="label">Monto</label>
        <div className="flex items-baseline gap-1">
          <span className={`display text-3xl font-bold ${aporte ? "text-cou" : "text-inc"}`}>$</span>
          <input id="cou-monto" autoFocus inputMode="decimal" placeholder="0" value={monto} onChange={(e) => { setMonto(e.target.value); setErr(""); }}
            className="num display text-4xl font-bold bg-transparent outline-none w-52 text-center border-b-2 border-line focus:border-brand pb-1" />
        </div>
        {!aporte && pendiente > 0 && (
          <button type="button" onClick={() => setMonto(fmtPlano.format(pendiente))} className="text-xs font-semibold text-brand mt-1">Devolvió todo: {money(pendiente)}</button>
        )}
      </div>

/* ---------- Cuotas: lo que viene y lo que falta cargar ---------- */
const mesesEntre = (iso, d) => { const [y, m] = iso.split("-").map(Number); return (d.getFullYear() - y) * 12 + (d.getMonth() + 1 - m); };
function cuotasActivas(movs, hoy) {
  const g = {};
  movs.filter((m) => m.tipo === "egreso" && m.cuota && m.tarjeta).forEach((m) => {
    const k = `${m.desc.trim().toLowerCase()}|${m.tarjeta}|${m.cuota.de}`;
    const prev = g[k];
    if (!prev || m.fecha.slice(0, 7) > prev.fecha.slice(0, 7) || (m.fecha.slice(0, 7) === prev.fecha.slice(0, 7) && m.cuota.n > prev.cuota.n)) g[k] = m;
  });
  return Object.values(g).map((e) => {
    const nHoy = e.cuota.n + mesesEntre(e.fecha, hoy);
    return { ...e, nHoy, cargadaEsteMes: e.fecha.startsWith(monthKey(hoy)) };
  }).filter((a) => a.nHoy <= a.cuota.de);
}

function FormCuotas({ pendientes, onLoad }) {
  const [filas, setFilas] = useState(() => pendientes.map((p) => ({ ...p, sel: true, txt: fmtPlano.format(p.monto) })));
  const [fecha, setFecha] = useState(toISO(new Date()));
  const [err, setErr] = useState("");
  const set = (id, patch) => setFilas((fs) => fs.map((f) => (f.id === id ? { ...f, ...patch } : f)));
  const elegidas = filas.filter((f) => f.sel);
  const cargar = () => {
    if (!elegidas.length) return setErr("Marcá al menos una cuota");
    const mala = elegidas.find((f) => !(parseMonto(f.txt) > 0));
    if (mala) return setErr(`Revisá el monto de ${mala.desc}`);
    onLoad(elegidas.map((f) => ({ id: uid(), tipo: "egreso", monto: parseMonto(f.txt), desc: f.desc, cat: f.cat, pago: "Tarjeta de Crédito",
      tarjeta: f.tarjeta, cuota: { n: f.nHoy, de: f.cuota.de }, fijo: !!f.fijo, fecha })));
  };
  return (
    <div className="flex flex-col gap-4">
      <p className="text-sm text-muted">Son las cuotas que siguen de compras que ya cargaste. Corregí el monto si cambió y cargalas juntas.</p>

        {filas.map((f) => (
          <li key={f.id} className={`rounded-2xl border p-3 flex items-center gap-3 ${f.sel ? "border-brand bg-brandsoft" : "border-line bg-surface2"}`}>
            <button type="button" onClick={() => set(f.id, { sel: !f.sel })} aria-pressed={f.sel} aria-label={`Incluir ${f.desc}`}
              className={`h-6 w-6 rounded-md border-2 grid place-items-center shrink-0 ${f.sel ? "bg-brand border-brand text-brandink" : "border-line bg-surface"}`}>
              {f.sel && <Ic n="Check" size={14} />}
            </button>
            <div className="min-w-0 flex-1">
              <p className="font-semibold text-sm truncate">{f.desc}</p>
              <p className="text-[11px] text-muted truncate">{f.tarjeta} · cuota {pad(f.nHoy)}/{pad(f.cuota.de)}</p>
            </div>
            <input id={`cuota-${f.id}`} inputMode="decimal" aria-label={`Monto ${f.desc}`} value={f.txt} onChange={(e) => { set(f.id, { txt: e.target.value }); setErr(""); }}
              className="num w-28 text-right bg-surface border border-line rounded-xl px-2.5 py-2 text-sm font-semibold outline-none focus:border-brand" />
          </li>
        ))}
      </ul>
      <Campo label="Fecha de carga" htmlFor="cuotas-fecha">
        <input id="cuotas-fecha" type="date" className="field" value={fecha} onChange={(e) => setFecha(e.target.value)} />
      </Campo>
      {err && <p className="text-sm text-exp font-medium" role="alert">{err}</p>}
      <button type="button" onClick={cargar} className="h-14 rounded-2xl font-bold text-white bg-exp flex items-center justify-center gap-2">
        <Ic n="Check" /> Cargar {elegidas.length} {elegidas.length === 1 ? "cuota" : "cuotas"} · <span className="num">{money(sum(elegidas, (f) => parseMonto(f.txt)))}</span>
      </button>
    </div>
  );
}

function CuotasQueVienen({ movs, tk }) {
  const hoy = new Date();
  const activas = cuotasActivas(movs, hoy);
  const meses = [1, 2, 3, 4, 5, 6].map((j) => {
    const d = new Date(hoy.getFullYear(), hoy.getMonth() + j, 1);
    const fila = { mes: MESES[d.getMonth()], total: 0 };
    TARJETAS.forEach((t) => { fila[t.id] = 0; });
    activas.forEach((a) => { if (a.nHoy + j <= a.cuota.de) { fila[a.tarjeta] = (fila[a.tarjeta] || 0) + a.monto; fila.total += a.monto; } });
    return fila;
  });
  const usadas = TARJETAS.filter((t) => meses.some((m) => m[t.id] > 0));
  const ttStyle = { background: tk.surface, border: `1px solid ${tk.line}`, borderRadius: 12, color: tk.ink, fontSize: 13 };
  const proximas = activas.filter((a) => a.nHoy < a.cuota.de).sort((a, b) => (b.cuota.de - b.nHoy) - (a.cuota.de - a.nHoy));

  return (
    <section className="rounded-3xl bg-surface border border-line p-5">
      <h2 className="display text-lg font-bold">Cuotas que vienen</h2>
      <p className="text-sm text-muted">Lo que ya tenés comprometido en las tarjetas los próximos meses</p>
      {meses[0].total === 0 && proximas.length === 0 ? (
        <div className="py-8 text-center text-sm text-muted"><Ic n="CalendarClock" size={28} className="mx-auto mb-2" />Cuando cargues compras en cuotas vas a ver acá lo que te queda por pagar.</div>
      ) : (
        <>
          <div className="mt-3 flex items-baseline justify-between gap-2 rounded-2xl bg-surface2 border border-line px-4 py-3">
            <span className="text-sm text-muted capitalize">{MESES_L[(hoy.getMonth() + 1) % 12]}</span>
            <span className="num display text-xl font-bold">{money(meses[0].total)}</span>
          </div>
          <div className="flex gap-3 text-xs font-semibold mt-3 flex-wrap">
            {usadas.map((t) => <span key={t.id} className="flex items-center gap-1.5"><span className="h-2.5 w-2.5 rounded-sm" style={{ background: t.color }} />{t.id}</span>)}
          </div>
          <div className="h-48 mt-2 -ml-2">
            {BarChart && (
              <ResponsiveContainer width="100%" height="100%">
                <BarChart data={meses} barCategoryGap="28%">
                  <CartesianGrid vertical={false} stroke={tk.line} strokeDasharray="3 3" />
                  <XAxis dataKey="mes" tick={{ fill: tk.muted, fontSize: 12 }} axisLine={false} tickLine={false} />
                  <YAxis tick={{ fill: tk.muted, fontSize: 11 }} axisLine={false} tickLine={false} width={44} tickFormatter={(v) => fmtCompact.format(v)} />
                  <Tooltip formatter={(v) => money(v)} contentStyle={ttStyle} cursor={{ fill: tk.line, opacity: 0.35 }} labelStyle={{ color: tk.muted }} />
                  {usadas.map((t, i) => <Bar key={t.id} dataKey={t.id} stackId="c" fill={t.color} radius={i === usadas.length - 1 ? [6, 6, 0, 0] : [0, 0, 0, 0]} isAnimationActive={false} />)}
                </BarChart>
              </ResponsiveContainer>
            )}
          </div>
          {proximas.length > 0 && (
            <ul className="mt-2 divide-y divide-line">
              {proximas.map((a) => {
                const fin = new Date(hoy.getFullYear(), hoy.getMonth() + (a.cuota.de - a.nHoy), 1);
                return (
                  <li key={a.id} className="py-2.5 flex items-center gap-3 text-sm">
                    <span className="h-2.5 w-2.5 rounded-full shrink-0" style={{ background: (TARJETAS.find((t) => t.id === a.tarjeta) || {}).color }} />
                    <div className="min-w-0 flex-1">
                      <p className="font-semibold truncate">{a.desc}</p>
                      <p className="text-xs text-muted">Quedan {a.cuota.de - a.nHoy} · termina en {MESES[fin.getMonth()]} {fin.getFullYear() !== hoy.getFullYear() ? fin.getFullYear() : ""}</p>
                    </div>
                    <span className="num font-semibold">{money(a.monto)}</span>
                  </li>
                );
              })}
            </ul>
          )}
          <p className="text-xs text-muted mt-3">Solo cuenta las cuotas que ya cargaste. No incluye consumos nuevos ni débitos automáticos como EDEA o Camuzzi.</p>
        </>
      )}
    </section>
  );
}

    if (!(t > 0)) return setErr("El monto total tiene que ser mayor a cero");

        { value: "debo", label: "Yo debo", activeCls: "bg-debt text-white shadow-sm" },

      ]} />
      <Campo label={tipo === "debo" ? "Acreedor (a quién le debo)" : "Deudor (quién me debe)"} htmlFor="d-persona">
        <input id="d-persona" className="field" placeholder="Nombre" value={persona} onChange={(e) => { setPersona(e.target.value); setErr(""); }} />
      </Campo>
      <Campo label="Detalle" htmlFor="d-detalle">
        <input id="d-detalle" className="field" placeholder="Opcional. Ej: préstamo, compra compartida" value={detalle} onChange={(e) => setDetalle(e.target.value)} />
      </Campo>
      <div className="grid grid-cols-2 gap-3">
        <Campo label="Monto total" htmlFor="d-total"><input id="d-total" inputMode="decimal" className="field num" placeholder="$ 0" value={total} onChange={(e) => { setTotal(e.target.value); setErr(""); }} /></Campo>
        <Campo label="Ya pagado" htmlFor="d-pagado"><input id="d-pagado" inputMode="decimal" className="field num" placeholder="$ 0" value={pagado} onChange={(e) => { setPagado(e.target.value); setErr(""); }} /></Campo>
      </div>
      {err && <p className="text-sm text-exp font-medium" role="alert">{err}</p>}
      <button type="submit" className="h-14 rounded-2xl font-bold bg-brand text-brandink flex items-center justify-center gap-2"><Ic n="Check" /> Guardar deuda</button>
    </form>
  );
}

function TarjetaDeuda({ d, onPago, onSaldar, onDelete }) {
  const [abierto, setAbierto] = useState(false);
  const [monto, setMonto] = useState("");
  const [err, setErr] = useState("");
  const falta = Math.max(0, d.total - d.pagado);
  const saldada = falta === 0;
  const debo = d.tipo === "debo";
  const color = debo ? "var(--debt)" : "var(--inc)";
  const registrar = () => {
    const n = parseMonto(monto);
    if (!(n > 0)) return setErr("Ingresá un monto válido");
    if (n > falta) return setErr(`El máximo es ${money(falta)}`);
    onPago(d.id, n); setMonto(""); setAbierto(false); setErr("");
  };
  return (
    <li className={`rounded-3xl bg-surface border border-line p-4 flex flex-col gap-3 ${saldada ? "opacity-75" : ""}`}>
      <div className="flex items-start gap-3">
        <span className="h-10 w-10 grid place-items-center rounded-2xl shrink-0 font-bold display" style={{ background: debo ? "var(--debt-soft)" : "var(--inc-soft)", color }}>
          {d.persona.slice(0, 1).toUpperCase()}
        </span>
        <div className="flex-1 min-w-0">
          <p className="font-semibold truncate">{d.persona}</p>
          {d.detalle && <p className="text-xs text-muted truncate">{d.detalle}</p>}
        </div>
        <span className={`text-xs font-bold px-2.5 py-1 rounded-full flex items-center gap-1 ${saldada ? "bg-incsoft text-inc" : "bg-debtsoft text-debt"}`}>
          <Ic n={saldada ? "CheckCircle2" : "Clock"} size={13} />{saldada ? "Saldado" : "Pendiente"}
        </span>
      </div>
      <Barra pct={(d.pagado / d.total) * 100} color={color} />
      <div className="flex justify-between text-sm gap-2 flex-wrap">
        <span className="text-muted">Pagado <span className="num font-semibold text-ink">{money(d.pagado)}</span> de <span className="num">{money(d.total)}</span></span>
        {!saldada && <span className="num font-bold" style={{ color }}>Falta {money(falta)}</span>}
      </div>
      {abierto && (
        <div className="flex flex-col gap-2">
          <div className="flex gap-2">
            <input id={`pago-${d.id}`} autoFocus inputMode="decimal" className="field num flex-1 min-w-0" placeholder="Monto del pago" value={monto} onChange={(e) => { setMonto(e.target.value); setErr(""); }} />
            <button onClick={registrar} className="px-4 rounded-2xl bg-brand text-brandink font-semibold">Registrar</button>
          </div>
          {err && <p className="text-xs text-exp font-medium">{err}</p>}
        </div>
      )}
      <div className="flex items-center gap-2 flex-wrap">
        {!saldada && <button onClick={() => setAbierto(!abierto)} className="px-3.5 h-9 rounded-full bg-surface2 border border-line text-sm font-semibold flex items-center gap-1.5"><Ic n="Plus" size={15} />{debo ? "Registrar pago" : "Registrar cobro"}</button>}
        {!saldada && <button onClick={() => onSaldar(d.id)} className="px-3.5 h-9 rounded-full bg-surface2 border border-line text-sm font-semibold flex items-center gap-1.5"><Ic n="Check" size={15} />Saldar</button>}
        <span className="flex-1" />
        <BorrarBtn onConfirm={() => onDelete(d.id)} />
      </div>
    </li>
  );
}

function Deudas({ data, setData, abrir }) {
  const [vista, setVista] = useState("debo");
  const lista = data.deudas.filter((d) => d.tipo === vista).sort((a, b) => (a.pagado >= a.total) - (b.pagado >= b.total));
  const pend = (t) => sum(data.deudas.filter((d) => d.tipo === t), (d) => Math.max(0, d.total - d.pagado));
  const upd = (fn) => setData((s) => ({ ...s, deudas: fn(s.deudas) }));
  return (
    <div className="flex flex-col gap-4">
      <div className="grid grid-cols-2 gap-3">
        <div className="rounded-2xl bg-debtsoft p-4 min-w-0"><p className="label" style={{ color: "var(--debt)" }}>Debo</p><p className="num display text-xl font-bold mt-1.5 break-words">{money(pend("debo"))}</p></div>
        <div className="rounded-2xl bg-incsoft p-4 min-w-0"><p className="label" style={{ color: "var(--inc)" }}>Me deben</p><p className="num display text-xl font-bold mt-1.5 break-words">{money(pend("meDeben"))}</p></div>
      </div>
      <Segmento value={vista} onChange={setVista} options={[
        { value: "debo", label: "Lo que debo", activeCls: "bg-surface text-debt shadow-sm" },
        { value: "meDeben", label: "Lo que me deben", activeCls: "bg-surface text-inc shadow-sm" },
      ]} />
      {lista.length === 0 ? (
        <Vacio icon="HandCoins">{vista === "debo" ? "No tenés deudas cargadas." : "No hay nadie que te deba plata cargado. Lo de Cousteau va en su propia sección."}</Vacio>
      ) : (
        <ul className="flex flex-col gap-3">
          {lista.map((d) => (
            <TarjetaDeuda key={d.id} d={d}
              onPago={(id, n) => upd((ds) => ds.map((x) => (x.id === id ? { ...x, pagado: Math.min(x.total, x.pagado + n) } : x)))}
              onSaldar={(id) => upd((ds) => ds.map((x) => (x.id === id ? { ...x, pagado: x.total } : x)))}
              onDelete={(id) => upd((ds) => ds.filter((x) => x.id !== id))} />
          ))}
        </ul>
      )}
      <button onClick={() => abrir("deuda")} className="h-12 rounded-2xl border-2 border-dashed border-line text-muted font-semibold flex items-center justify-center gap-2"><Ic n="Plus" size={18} />Nueva deuda</button>
    </div>
  );
}

/* ---------- Ahorros ---------- */
function FormMeta({ onSave }) {
  const [nombre, setNombre] = useState("");
  const [objetivo, setObjetivo] = useState("");
  const [inicial, setInicial] = useState("");
  const [limite, setLimite] = useState("");
  const [err, setErr] = useState("");
  const sugerencias = ["Fondo de emergencia", "Vacaciones", "Auto", "Para Vicente"];
  const guardar = (e) => {
    e.preventDefault();
    const o = parseMonto(objetivo), i = inicial ? parseMonto(inicial) : 0;
    if (!nombre.trim()) return setErr("Ponele un nombre a la meta");
    if (!(o > 0)) return setErr("El monto objetivo tiene que ser mayor a cero");
    if (isNaN(i) || i < 0) return setErr("El monto inicial no es válido");
    onSave({ id: uid(), nombre: nombre.trim(), objetivo: o, actual: i, limite });
  };
  return (
    <form onSubmit={guardar} className="flex flex-col gap-4">
      <Campo label="Nombre de la meta" htmlFor="m-nombre">
        <input id="m-nombre" className="field" placeholder="Ej: Vacaciones" value={nombre} onChange={(e) => { setNombre(e.target.value); setErr(""); }} />
        <div className="flex flex-wrap gap-1.5 mt-1">
          {sugerencias.map((s) => <button type="button" key={s} onClick={() => setNombre(s)} className="text-xs px-2.5 py-1.5 rounded-full bg-surface2 border border-line">{s}</button>)}
        </div>
      </Campo>
      <div className="grid grid-cols-2 gap-3">
        <Campo label="Monto objetivo" htmlFor="m-obj"><input id="m-obj" inputMode="decimal" className="field num" placeholder="$ 0" value={objetivo} onChange={(e) => { setObjetivo(e.target.value); setErr(""); }} /></Campo>
        <Campo label="Ya tengo" htmlFor="m-ini"><input id="m-ini" inputMode="decimal" className="field num" placeholder="$ 0" value={inicial} onChange={(e) => setInicial(e.target.value)} /></Campo>
      </div>
      <Campo label="Fecha límite" htmlFor="m-lim" hint="Opcional. Te calculamos cuánto separar por mes.">
        <input id="m-lim" type="date" className="field" value={limite} onChange={(e) => setLimite(e.target.value)} />
      </Campo>
      {err && <p className="text-sm text-exp font-medium" role="alert">{err}</p>}
      <button type="submit" className="h-14 rounded-2xl font-bold bg-inc text-white flex items-center justify-center gap-2"><Ic n="Target" /> Crear meta</button>
    </form>
  );
}

function TarjetaMeta({ m, onMover, onDelete }) {
  const [monto, setMonto] = useState("");
  const [err, setErr] = useState("");
  const pct = (m.actual / m.objetivo) * 100;
  const falta = Math.max(0, m.objetivo - m.actual);
  const lista = falta === 0;
  let porMes = null;
  if (m.limite && !lista) {
    const hoy = new Date(), l = new Date(m.limite + "T12:00:00");
    const meses = Math.max(1, (l.getFullYear() - hoy.getFullYear()) * 12 + (l.getMonth() - hoy.getMonth()));
    porMes = l > hoy ? { meses, monto: falta / meses } : { vencida: true };
  }
  const mover = (signo, valor) => {
    const n = valor ?? parseMonto(monto);
    if (!(n > 0)) return setErr("Ingresá un monto válido");
    if (signo < 0 && n > m.actual) return setErr(`Solo hay ${money(m.actual)} en esta meta`);
    onMover(m.id, signo * n); setMonto(""); setErr("");
  };
  return (
    <li className="rounded-3xl bg-surface border border-line p-5 flex flex-col gap-3">
      <div className="flex items-start gap-3">
        <span className="h-11 w-11 grid place-items-center rounded-2xl bg-incsoft text-inc shrink-0"><Ic n={lista ? "Trophy" : "PiggyBank"} size={22} /></span>
        <div className="flex-1 min-w-0">
          <p className="font-semibold">{m.nombre}</p>
          <p className="text-xs text-muted">{m.limite ? `Hasta el ${fmtDate(m.limite)}` : "Sin fecha límite"}</p>
        </div>
        <p className="num display text-2xl font-bold text-inc">{Math.min(100, Math.round(pct))}%</p>
      </div>
      <Barra pct={pct} />
      <div className="flex justify-between text-sm gap-2 flex-wrap">
        <span><span className="num font-bold">{money(m.actual)}</span><span className="text-muted"> de <span className="num">{money(m.objetivo)}</span></span></span>
        {lista ? <span className="font-bold text-inc">¡Meta cumplida!</span> : <span className="num text-muted">Faltan {money(falta)}</span>}
      </div>
      {porMes && (
        <p className="text-xs rounded-xl bg-surface2 px-3 py-2 text-muted">
          {porMes.vencida ? "La fecha límite ya pasó." :
            <>Separando <span className="num font-semibold text-ink">{money(porMes.monto)}</span> por mes llegás en {porMes.meses} {porMes.meses === 1 ? "mes" : "meses"}.</>}
        </p>
      )}
      <div className="flex flex-col gap-2 pt-1">
        <div className="flex gap-1.5">
          {[10000, 50000, 100000].map((v) => (
            <button key={v} onClick={() => mover(1, v)} className="flex-1 h-9 rounded-full bg-incsoft text-inc text-sm font-semibold num">+{fmtCompact.format(v)}</button>
          ))}
        </div>
        <div className="flex gap-2">
          <input id={`meta-${m.id}`} inputMode="decimal" className="field num flex-1 min-w-0" placeholder="Otro monto" value={monto} onChange={(e) => { setMonto(e.target.value); setErr(""); }} />
          <button onClick={() => mover(1)} className="px-4 rounded-2xl bg-inc text-white font-semibold">Agregar</button>
          <button onClick={() => mover(-1)} className="px-3 rounded-2xl bg-surface2 border border-line font-semibold text-sm">Retirar</button>
        </div>
        {err && <p className="text-xs text-exp font-medium">{err}</p>}
      </div>
      <div className="flex justify-end -mb-2"><BorrarBtn onConfirm={() => onDelete(m.id)} /></div>
    </li>
  );
}

function Ahorros({ data, setData, abrir }) {
  const total = sum(data.metas, (m) => m.actual);
  const obj = sum(data.metas, (m) => m.objetivo);
  const upd = (fn) => setData((s) => ({ ...s, metas: fn(s.metas) }));
  return (
    <div className="flex flex-col gap-4">
      <section className="rounded-3xl bg-incsoft p-5">
        <p className="label" style={{ color: "var(--inc)" }}>Ahorrado en metas</p>
        <p className="num display text-3xl font-bold mt-1">{money(total)}</p>
        <div className="mt-3"><Barra pct={obj ? (total / obj) * 100 : 0} /></div>
        <p className="text-sm text-muted mt-2">{obj ? `${Math.round((total / obj) * 100)}% del total de tus ${data.metas.length} metas (${money(obj)})` : "Creá tu primera meta para empezar"}</p>
      </section>
      <ul className="flex flex-col gap-3">
        {data.metas.map((m) => (
          <TarjetaMeta key={m.id} m={m}
            onMover={(id, n) => upd((ms) => ms.map((x) => (x.id === id ? { ...x, actual: Math.max(0, x.actual + n) } : x)))}
            onDelete={(id) => upd((ms) => ms.filter((x) => x.id !== id))} />
        ))}
      </ul>
      <button onClick={() => abrir("meta")} className="h-12 rounded-2xl border-2 border-dashed border-line text-muted font-semibold flex items-center justify-center gap-2"><Ic n="Plus" size={18} />Nueva meta de ahorro</button>
    </div>
  );
}

/* ---------- Ajustes: categorías y medios de pago ---------- */
function EditorItem({ inicial, iconos, conColor, colores = COLORES_CAT, colorInicial, iconoFijo, onGuardar, onCancelar, existe }) {
  const [nombre, setNombre] = useState(inicial ? inicial.id : "");
  const [icon, setIcon] = useState(inicial ? inicial.icon : iconos ? iconos[0] : iconoFijo);
  const [color, setColor] = useState(inicial && inicial.color ? inicial.color : colorInicial || colores[0]);
  const [err, setErr] = useState("");
  const guardar = () => {
    const n = nombre.trim();
    if (!n) return setErr("Escribí un nombre");
    if (existe(n)) return setErr("Ya hay uno con ese nombre");
    onGuardar({ id: n, icon, ...(conColor ? { color } : {}) });
  };
  const tinte = conColor ? color : "var(--brand)";
  return (
    <div className="rounded-2xl border border-brand bg-surface p-3.5 flex flex-col gap-3">
      <input id={`ed-nombre-${inicial ? inicial.key : "nuevo"}`} autoFocus className="field" placeholder="Nombre" value={nombre}
        onChange={(e) => { setNombre(e.target.value); setErr(""); }} onKeyDown={(e) => e.key === "Enter" && guardar()} />
      {iconos && <div>
        <p className="label mb-1.5">Ícono</p>
        <div className="grid grid-cols-8 gap-1.5">
          {iconos.map((n) => (
            <button type="button" key={n} onClick={() => setIcon(n)} aria-label={`Ícono ${n}`} aria-pressed={icon === n}
              className={`h-9 rounded-xl grid place-items-center border ${icon === n ? "border-transparent" : "border-line bg-surface2 text-muted"}`}
              style={icon === n ? { background: conColor ? color + "26" : "var(--brand-soft)", color: tinte, boxShadow: `inset 0 0 0 2px ${tinte}` } : {}}>
              <Ic n={n} size={17} />
            </button>
          ))}
        </div>
      </div>}
      {conColor && (
        <div>
          <p className="label mb-1.5">Color</p>
          <div className="flex flex-wrap gap-2">
            {colores.map((c) => (
              <button type="button" key={c} onClick={() => setColor(c)} aria-label={`Color ${c}`} aria-pressed={color === c}
                className="h-8 w-8 rounded-full" style={{ background: c, boxShadow: color === c ? `0 0 0 2px var(--surface), 0 0 0 4px ${c}` : "none" }} />
            ))}
          </div>
        </div>
      )}
      {err && <p className="text-sm text-exp font-medium" role="alert">{err}</p>}
      <div className="flex gap-2">
        <button type="button" onClick={guardar} className="flex-1 h-11 rounded-xl bg-brand text-brandink font-semibold">Guardar</button>
        <button type="button" onClick={onCancelar} className="px-4 h-11 rounded-xl bg-surface2 border border-line font-semibold">Cancelar</button>
      </div>
    </div>
  );
}

function ListaEditable({ items, iconos, conColor, colores = COLORES_CAT, iconoFijo, protegido, minimo = 1, onCambiar, onRenombrar, nuevoLabel }) {
  const [editando, setEditando] = useState(null);
  const existe = (n, key) => items.some((x) => x.key !== key && x.id.trim().toLowerCase() === n.toLowerCase());
  const libre = colores.find((c) => !items.some((x) => x.color === c)) || colores[0];
  return (
    <div className="flex flex-col gap-2">
      <ul className="flex flex-col gap-2">
        {items.map((it) => editando === it.key ? (
          <li key={it.key}>
            <EditorItem inicial={it} iconos={iconos} conColor={conColor} colores={colores} iconoFijo={iconoFijo} existe={(n) => existe(n, it.key)} onCancelar={() => setEditando(null)}
              onGuardar={(v) => { onCambiar(items.map((x) => (x.key === it.key ? { ...x, ...v } : x))); if (v.id !== it.id) onRenombrar(it.id, v.id); setEditando(null); }} />
          </li>
        ) : (
          <li key={it.key} className="flex items-center gap-3 rounded-2xl bg-surface2 border border-line px-3 py-2">
            <span className="h-9 w-9 grid place-items-center rounded-xl shrink-0" style={conColor ? { background: it.color + "22", color: it.color } : { background: "var(--brand-soft)", color: "var(--brand)" }}><Ic n={it.icon} size={18} /></span>
            <span className="flex-1 min-w-0 font-medium truncate">{it.id}</span>
            {protegido && protegido(it) ? (
              <span className="text-[11px] text-muted text-right leading-tight">Fijo: activa<br />tarjetas y cuotas</span>
            ) : (
              <>
                <button type="button" onClick={() => setEditando(it.key)} className="h-9 w-9 grid place-items-center rounded-full text-muted hover:bg-surface" aria-label={`Editar ${it.id}`}><Ic n="Pencil" size={16} /></button>
                {items.length > minimo && <BorrarBtn onConfirm={() => onCambiar(items.filter((x) => x.key !== it.key))} />}
              </>
            )}
          </li>
        ))}
      </ul>
      {editando === "nuevo" ? (
        <EditorItem iconos={iconos} conColor={conColor} colores={colores} colorInicial={libre} iconoFijo={iconoFijo} existe={(n) => existe(n)} onCancelar={() => setEditando(null)}
          onGuardar={(v) => { onCambiar([...items, { ...v, key: "k" + uid() }]); setEditando(null); }} />
      ) : (
        <button type="button" onClick={() => setEditando("nuevo")} className="h-11 rounded-xl border-2 border-dashed border-line text-muted font-semibold text-sm flex items-center justify-center gap-2"><Ic n="Plus" size={16} />{nuevoLabel}</button>
      )}
    </div>
  );
}

  if (seccion === "medios") return (
    <div className="flex flex-col gap-4">
      <button type="button" onClick={() => setSeccion(null)} className="self-start text-sm font-semibold text-brand flex items-center gap-1"><Ic n="ChevronLeft" size={16} />Ajustes</button>
      <p className="text-sm text-muted">Los que agregues aparecen al cargar movimientos, gastos fijos y aportes a Cousteau. Si cambiás un nombre, se actualiza en todo lo que ya cargaste.</p>
      <ListaEditable items={meds} iconos={ICONOS_MEDIO} protegido={(m) => m.id === CREDITO} nuevoLabel="Agregar medio de pago"
